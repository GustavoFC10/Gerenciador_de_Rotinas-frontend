components:
  schemas:
    AcceptedResponse:
      type: object
      properties:
        detail:
          type: string
      required:
        - detail
    ActiveMembershipInput:
      type: object
      description: Reject input keys that are not part of the public API contract.
      properties:
        membershipId:
          type: string
          format: uuid
      required:
        - membershipId
    AddOwnerInput:
      type: object
      description: Reject input keys that are not part of the public API contract.
      properties:
        name:
          type: string
          maxLength: 160
        email:
          type: string
          format: email
      required:
        - email
        - name
    AgendaColumn:
      type: object
      properties:
        status:
          type: string
        count:
          type: integer
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        hasMore:
          type: boolean
      required:
        - count
        - hasMore
        - status
        - tasks
    AgendaProjection:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/AgendaProjectionTypeEnum'
        screen:
          $ref: '#/components/schemas/ScreenSummary'
        competenceId:
          type: string
          format: uuid
          nullable: true
        period:
          type: string
          format: date
        columns:
          type: array
          items:
            $ref: '#/components/schemas/AgendaColumn'
      required:
        - columns
        - competenceId
        - period
        - screen
        - type
    AgendaProjectionTypeEnum:
      enum:
        - agenda
      type: string
      description: '* `agenda` - agenda'
    AltItensEnum:
      enum:
        - societario
        - capital
        - bens
        - endereco
        - razao
        - atividades
        - outros
      type: string
      description: |-
        * `societario` - societario
        * `capital` - capital
        * `bens` - bens
        * `endereco` - endereco
        * `razao` - razao
        * `atividades` - atividades
        * `outros` - outros
    Analysis:
      type: object
      properties:
        currentStage:
          type: integer
          nullable: true
        completedTasks:
          type: integer
        totalTasks:
          type: integer
        releaseDate:
          type: string
          format: date
          nullable: true
        waiting:
          type: boolean
        late:
          type: boolean
        pendingSectors:
          type: array
          items:
            $ref: '#/components/schemas/ProcessSectorEnum'
      required:
        - completedTasks
        - currentStage
        - late
        - pendingSectors
        - releaseDate
        - totalTasks
        - waiting
    Assignee:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        displayName:
          type: string
          readOnly: true
        organizationRole:
          type: string
          readOnly: true
        departmentRole:
          type: string
          readOnly: true
      required:
        - departmentRole
        - displayName
        - id
        - organizationRole
    Attachment:
      type: object
      properties:
        attachmentId:
          type: string
          format: uuid
        createdByMemberId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        file:
          $ref: '#/components/schemas/File'
      required:
        - attachmentId
        - createdAt
        - createdByMemberId
        - file
    AttachmentBindingResponse:
      type: object
      properties:
        fileId:
          type: string
          format: uuid
          nullable: true
        version:
          type: integer
        etag:
          type: string
        attachmentId:
          type: string
          format: uuid
        taskId:
          type: string
          format: uuid
        materialized:
          type: boolean
        attachmentCount:
          type: integer
          minimum: 0
      required:
        - attachmentCount
        - etag
        - fileId
        - version
    AttachmentPage:
      type: object
      properties:
        count:
          type: integer
        next:
          type: string
          format: uri
          nullable: true
        previous:
          type: string
          format: uri
          nullable: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
      required:
        - count
        - next
        - previous
        - results
    BindingResponse:
      type: object
      properties:
        fileId:
          type: string
          format: uuid
          nullable: true
        version:
          type: integer
        etag:
          type: string
        attachmentId:
          type: string
          format: uuid
        taskId:
          type: string
          format: uuid
        materialized:
          type: boolean
      required:
        - etag
        - fileId
        - version
    CampoEnum:
      enum:
        - custo
        - honorario
        - regime
        - altdef
