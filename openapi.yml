        - mei
        - outro
        - alteracao
        - inatividade
        - inativa
        - reativacao
        - baixa
        - saida
        - exclusao
      type: string
      description: |-
        * `abertura` - Abertura de empresa
        * `mei` - Transformação MEI → ME
        * `outro` - Cliente de outro escritório
        * `alteracao` - Alteração contratual
        * `inatividade` - Paralisação de empresa
        * `inativa` - Inatividade de empresa
        * `reativacao` - Reativação de empresa
        * `baixa` - Baixa de empresa
        * `saida` - Saída de cliente
        * `exclusao` - Exclusão de cliente
    UploadIntent:
      type: object
      description: Reject input keys that are not part of the public API contract.
      properties:
        purpose:
          $ref: '#/components/schemas/PurposeEnum'
        originalName:
          type: string
          maxLength: 200
        sizeBytes:
          type: integer
          minimum: 1
        contentType:
          type: string
          maxLength: 100
        target:
          $ref: '#/components/schemas/UploadTarget'
      required:
        - contentType
        - originalName
        - purpose
        - sizeBytes
        - target
    UploadPost:
      type: object
      properties:
        url:
          type: string
          format: uri
        fields:
          type: object
          additionalProperties:
            type: string
        method:
          $ref: '#/components/schemas/MethodEnum'
        enctype:
          $ref: '#/components/schemas/EnctypeEnum'
      required:
        - enctype
        - fields
        - method
        - url
    UploadResponse:
      type: object
      properties:
        intentId:
          type: string
          format: uuid
        fileId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
        uploadExpiresAt:
          type: string
          format: date-time
        upload:
          $ref: '#/components/schemas/UploadPost'
      required:
        - expiresAt
        - fileId
        - intentId
        - upload
        - uploadExpiresAt
    UploadTarget:
      type: object
      description: Reject input keys that are not part of the public API contract.
      properties:
        taskId:
          type: string
          format: uuid
        competenceId:
          type: string
          format: uuid
        referenceMonth:
          type: string
          pattern: ^\d{4}-\d{2}$
        occurrenceKey:
          type: string
          format: uuid
        memberId:
          type: string
          format: uuid
        departmentId:
          type: string
          format: uuid
    UserSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        isPlatformStaff:
          type: boolean
      required:
        - email
        - id
        - isPlatformStaff
    VariantEnum:
      enum:
        - '64'
        - '256'
      type: string
      description: |-
        * `64` - 64
        * `256` - 256
    VariantMetadata:
      type: object
      properties:
        kind:
          type: string
        width:
          type: integer
        height:
          type: integer
        contentType:
          type: string
      required:
        - contentType
        - height
        - kind
        - width
    Version:
      type: object
      description: Reject input keys that are not part of the public API contract.
      properties:
        version:
          type: integer
          minimum: 1
      required:
        - version
      additionalProperties: false
    WorkflowStage:
      type: object
      properties:
        t:
          type: string
        tSem:
          type: string
        note:
          type: string
        espera:
          type: integer
        opcional:
          type: string
        seNao:
          type: string
        index:
          type: integer
        completed:
          type: boolean
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowTask'
      required:
        - t
        - tasks
    WorkflowTask:
      type: object
