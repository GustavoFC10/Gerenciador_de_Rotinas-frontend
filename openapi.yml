    get:
      operationId: processes_list
      description:
        Lista paginada do tenant ativo. Dados financeiros são omitidos
        por permissão.
      parameters:
        - in: query
          name: late
          schema:
            type: boolean
        - in: query
          name: month
          schema:
            type: string
            pattern: ^\d{4}-(0[1-9]|1[0-2])$
            minLength: 1
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
        - in: query
          name: q
          schema:
            type: string
            maxLength: 200
            minLength: 1
        - in: query
          name: setor
          schema:
            enum:
              - com
              - fin
              - reg
            type: string
            minLength: 1
          description: |-
            * `com` - Diretoria
            * `fin` - Financeiro
            * `reg` - Regularidade
        - in: query
          name: status
          schema:
            enum:
              - andamento
              - concluido
              - cancelado
            type: string
            minLength: 1
          description: |-
            * `andamento` - andamento
            * `concluido` - concluido
            * `cancelado` - cancelado
        - in: query
          name: tipo
          schema:
            enum:
              - abertura
              - mei
              - outro
              - alteracao
              - inatividade
              - inativa
              - reativacao
              - baixa
              - saida
              - exclusao
            type: string
            minLength: 1
          description: |-
            * `abertura` - abertura
            * `mei` - mei
            * `outro` - outro
            * `alteracao` - alteracao
            * `inatividade` - inatividade
            * `inativa` - inativa
            * `reativacao` - reativacao
            * `baixa` - baixa
            * `saida` - saida
            * `exclusao` - exclusao
