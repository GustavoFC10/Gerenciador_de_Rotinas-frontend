        campo:
          $ref: '#/components/schemas/CampoEnum'
        auto:
          type: boolean
        opt:
          type: boolean
        guia:
          type: boolean
        marco:
          type: boolean
        reuniao:
          $ref: '#/components/schemas/ReuniaoEnum'
      required:
        - d
        - id
        - txt
