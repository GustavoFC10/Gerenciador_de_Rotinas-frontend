    items.push(`<div class="opc ${inp.usarHoras?'on':''}"><label class="switch"><input type="checkbox" id="${ns}-usarHoras" data-ns="${ns}" data-k="usarHoras" ${inp.usarHoras?'checked':''}><span><b>Tempo adicional da equipe</b><small>Calcula pelo custo/hora quando o cliente exige mais trabalho.</small></span></label>
      ${inp.usarHoras?`<div class="opc-b"><label class="f" for="${ns}-horas">Horas estimadas por mês <span class="hint">Digitação, conciliação, apuração e atendimento deste cliente.</span><div class="suffix" style="max-width:220px"><input id="${ns}-horas" type="number" min="0" step="0.5" inputmode="decimal" data-ns="${ns}" data-k="horas" value="${n(inp.horas)}"><span>h</span></div><span class="hint">Custo/hora da equipe ${brl(n(P.horas.custoHora))} · margem desejada ${numBR(n(P.horas.margem))}% · ${({maior:'vale o maior entre tabela e horas',horas:'vale o cálculo por horas',tabela:'horas só para conferir a margem'})[P.horas.metodo]||''}</span></label></div>`:''}</div>`);
  }
  if(P.servicos.length){const on=grpOpen(ns,'serv',inp);
    items.push(`<div class="opc ${on?'on':''}"><label class="switch"><input type="checkbox" id="${ns}-grp-serv" data-act-change="grp-toggle" data-ns2="${ns}" data-g="serv" ${on?'checked':''}><span><b>Serviços adicionais</b><small>Consultoria, BPO, IRPF e outros serviços cobrados à parte.</small></span></label>
      ${on?`<div class="opc-b"><div class="chips">${P.servicos.map(sv=>`<label class="chip"><input type="checkbox" data-ns="${ns}" data-k="servicos" data-v="${esc(sv.id)}" ${(inp.servicos||[]).includes(sv.id)?'checked':''}>${esc(sv.nome)} <small>${brl0(n(sv.valor))}</small></label>`).join('')}</div></div>`:''}</div>`);
  }
  if(!soServ&&(P.anomalias||[]).length){const on=grpOpen(ns,'exc',inp);

      ${on?`<div class="opc-b"><div class="chips">${P.anomalias.map(x=>`<label class="chip"><input type="checkbox" data-ns="${ns}" data-k="anomalias" data-v="${esc(x.id)}" ${(inp.anomalias||[]).includes(x.id)?'checked':''}>${esc(x.nome)} <small>+${numBR(n(x.pct))}%</small></label>`).join('')}</div></div>`:''}</div>`);
  }
  if(!items.length)return '';
  return `<fieldset class="grp tone-opc"><legend>Ajustes do honorário</legend><p class="hint" style="margin:-4px 0 0">Ative só o que se aplica a este cliente.</p><div class="opc-list">${items.join('')}</div></fieldset>`;
}
function servFieldset(inp,ns){const P=state.params;if(!P.servicos.length)return '';const on=grpOpen(ns,'serv',inp);return `<fieldset class="grp tone-serv"><legend>Serviços adicionais</legend>${grpSwitch(ns,'serv',on,'Incluir serviços adicionais')}${on?`<div class="chips">${P.servicos.map(s=>`<label class="chip"><input type="checkbox" data-ns="${ns}" data-k="servicos" data-v="${esc(s.id)}" ${(inp.servicos||[]).includes(s.id)?'checked':''}>${esc(s.nome)} <small>${brl0(n(s.valor))}</small></label>`).join('')}</div>`:''}</fieldset>`}

    <div class="fg">

function gapHTML(atual,sug){

  if(s==='acima')return `<div class="gapbox acima"><span>Cobra ${brl(atual)} · ${pct(d/sug)} acima</span><strong>${brl(d)} acima do parâmetro</strong><span>Revise o escopo ou mantenha como margem extra.</span></div>`;
  return `<div class="gapbox alinhado"><span>Cobra ${brl(atual)}</span><strong>Alinhado ao parâmetro</strong><span>Diferença de ${brl(d)} dentro da tolerância.</span></div>`;

function marginHTML(r,atual){
  if(!(r.custo>0))return '';

}
function syncCalcPreco(inp=state.calc){

function calcPrecoFinal(inp=state.calc){

function calcOrcDados(){
  const c=state.calc;
  return {prospect:c.prospect||'',contato:c.contato||'',validadeDias:c.validadeDias!=null?n(c.validadeDias):(n(state.perfil.validadeDias)||15),
    decimoTerceiro:c.decimoTerceiro!=null?!!c.decimoTerceiro:!!state.params.decimoTerceiro,ofertarPlanos:c.ofertarPlanos!=null?!!c.ofertarPlanos:true,
    aberturaOn:!!c.aberturaOn,aberturaValor:c.aberturaValor!=null?n(c.aberturaValor):0,aberturaParcelas:Math.max(1,n(c.aberturaParcelas)||1),inicioCobranca:iniClamp(c.inicioCobranca)};
}
function iniClamp(v){return v==null||v===''?1:Math.min(3,Math.max(0,Math.round(n(v))))}
function iniTxt(i){return i===0?'no ato da contratação':'na '+i+'ª competência'}
function compTxt(q){return q+' '+plural(q,'competência','competências')}
function aberturaTxt(ab){if(!ab||!(n(ab.valor)>0))return '';const p=Math.max(1,n(ab.parcelas)||1);return p===1?brl(n(ab.valor))+' à vista':p+'× de '+brl(n(ab.valor)/p)+' (total '+brl(n(ab.valor))+')'}
function calcValorRef(){const o=calcOrcDados(),pl=calcPlanosOrc();if(o.ofertarPlanos&&pl.length)return n((pl.find(p=>p.destaque)||pl[0]).valor);return calcPrecoFinal(state.calc)}
function calcCondHTML(){
  const o=calcOrcDados(), ab=o.aberturaOn&&o.aberturaValor>0, ben=Math.max(0,o.inicioCobranca-1), ato=o.inicioCobranca===0;
  if(!ab&&!ben&&!ato)return '';
  const pl=calcPlanosOrc(), ref=calcValorRef();
  return `<div class="cond-box"><div class="eyebrow">Condições comerciais</div>${ab?`<div class="cond-r"><span>Honorário de abertura</span><b>${esc(aberturaTxt({valor:o.aberturaValor,parcelas:o.aberturaParcelas}))}</b></div>`:''}${ato?`<div class="cond-r"><span>Primeiro honorário mensal</span><b>Cobrado no ato da contratação</b></div>`:''}${ben?`<div class="cond-r ben"><span><em class="ben-tag">Benefício concedido</em>1º honorário na ${o.inicioCobranca}ª competência</span><b>${compTxt(ben)} sem cobrança · ${brl(ref*ben)}${o.ofertarPlanos&&pl.length?'<small>no plano recomendado</small>':''}</b></div>`:''}</div>`;
}
function calcPlanosOrc(){
  const inp=state.calc;if(!planosHabilitados()||inp.inativa)return [];
  const r=calcular(inp), final=calcPrecoFinal(inp);
  let pl=calcPlanos(inp);
  if(pl.length&&r.total>0&&Math.abs(final-r.total)>0.009){const ratio=final/r.total;pl=pl.map(p=>Object.assign({},p,{valor:arred(n(p.valor)*ratio)}))}
  const ov=inp.planosOv||{};
  return pl.map(p=>ov[p.id]!=null?Object.assign({},p,{valor:ov[p.id]}):p);
}
function calcPlanosHTML(){
  const pl=calcPlanosOrc();if(!pl.length)return '';
  const o=calcOrcDados();
  return `<div class="orc-planos"><label class="switch"><input type="checkbox" id="calc-ofertarPlanos" data-act-change="calc-planos" ${o.ofertarPlanos?'checked':''}>Ofertar em ${pl.length} planos</label>
    ${o.ofertarPlanos?`<div class="orc-pl-list">${pl.map(p=>`<label class="orc-pl ${p.destaque?'dest':''}" for="calc-pl-${esc(p.id)}"><span><b>${esc(p.nome)}${p.destaque&&!/recomend/i.test(p.nome)?' <em class="orc-tag">Recomendado</em>':''}</b>${p.descricao?`<small>${esc(p.descricao)}</small>`:''}</span><span class="prefix"><span>R$</span><input id="calc-pl-${esc(p.id)}" type="number" min="0" step="10" inputmode="decimal" data-ns="calcp" data-id="${esc(p.id)}" value="${n(p.valor)}"></span></label>`).join('')}</div><p class="muted" style="margin:0;font-size:12px">O que entra em cada plano é definido em Parâmetros › Planos.</p>`:`<p class="muted" style="margin:0;font-size:12px">A proposta sai com um único valor: o valor a propor acima.</p>`}</div>`;
}

function proximoNumero(){

}
function planosHabilitados(P=state.params){return !!(P.planos&&P.planos.ativo&&planosAtivos(P).length)}
function openNovoOrc(inp,prefill){
  const r=calcular(inp);
  const final=prefill&&prefill.valor!=null?n(prefill.valor):inp===state.calc?calcPrecoFinal(inp):r.total;
  let pl=planosHabilitados()?calcPlanos(inp):[];
  if(pl.length&&r.total>0&&Math.abs(final-r.total)>0.009){
    const ratio=final/r.total;
    pl=pl.map(p=>Object.assign({},p,{valor:arred(n(p.valor)*ratio)}));
  }
  const base={inp:pickInp(inp),prospect:'',contato:'',valor:final,validadeDias:n(state.perfil.validadeDias)||15,origemCliente:null,ofertarPlanos:pl.length>0,planos:pl,decimoTerceiro:!!state.params.decimoTerceiro};
  state.edit=Object.assign(base,prefill||{});
  if(prefill==null||prefill.valor==null)state.edit.valor=final;
  if(!planosHabilitados()){state.edit.ofertarPlanos=false;state.edit.planos=[]}
  state.modal='novo-orc';renderModal();
}

function descHTML(desc,dm){
  if(desc>dm+1e-9)return `<div class="warnline">Desconto de ${pct(desc,1)} acima do limite de ${pct(dm)} definido nos parâmetros.</div>`;
  if(desc>0.0001)return `<p class="muted" style="margin:0;font-size:13px">Desconto de ${pct(desc,1)} sobre o parâmetro (limite ${pct(dm)}).</p>`;
  if(desc<-0.0001)return `<p class="muted" style="margin:0;font-size:13px">${pct(-desc,1)} acima do parâmetro.</p>`;
  return `<p class="muted" style="margin:0;font-size:13px">Valor igual ao parâmetro.</p>`;
}

function escopoItens(inp){
  const P=state.params, it=[];
  if(inp.inativa){
    it.push('Manutenção de empresa inativa no regime '+regNome(inp.regime));
    it.push('Entrega das declarações e obrigações acessórias sem movimento');
    it.push('Acompanhamento de pendências na Receita Federal, estado e município');
    (inp.servicos||[]).forEach(id=>{const sv=P.servicos.find(x=>x.id===id);if(sv)it.push(sv.nome)});
    String(state.perfil.escopoExtra||'').split('\n').map(x=>x.trim()).filter(Boolean).forEach(x=>it.push(x));
    return it;
  }
  it.push('Escrituração contábil e fiscal no regime '+regNome(inp.regime));
  it.push('Apuração de tributos e entrega das obrigações acessórias');
  it.push('Balancete, balanço patrimonial e DRE');
  const f=n(inp.funcionarios), s=n(inp.socios);
  if(f>0)it.push('Folha de pagamento de até '+f+' '+plural(f,'funcionário','funcionários')+', eSocial e FGTS Digital');
  if(s>0&&P.socios.ativo!==false)it.push('Pró-labore de '+s+' '+plural(s,'sócio','sócios'));
  if(P.xml.ativo!==false)it.push('Importação e conferência de até '+n(inp.xml).toLocaleString('pt-BR')+' XMLs por mês');
  if(inp.emiteNF)it.push('Emissão de até '+n(inp.notas)+' notas fiscais por mês pelo escritório');
  if(n(inp.filiais)>0)it.push('Atendimento a '+n(inp.filiais)+' '+plural(n(inp.filiais),'filial ativa','filiais ativas'));
  if(n(inp.filiaisInativas)>0)it.push('Manutenção de '+n(inp.filiaisInativas)+' '+plural(n(inp.filiaisInativas),'filial inativa','filiais inativas')+' (obrigações sem movimento)');
  (inp.servicos||[]).forEach(id=>{const sv=P.servicos.find(x=>x.id===id);if(sv)it.push(sv.nome)});
  String(state.perfil.escopoExtra||'').split('\n').map(x=>x.trim()).filter(Boolean).forEach(x=>it.push(x));
  return it;
}

      <div class="pcard ${D.socios.ativo===false?'off':''}"><div class="pc-h"><h3>Sócios com pró-labore</h3><label class="switch"><input type="checkbox" data-ns="par" data-path="socios.ativo" ${D.socios.ativo!==false?'checked':''} aria-label="Cobrar por sócio com pró-labore">${D.socios.ativo!==false?'Cobrando':'Sem cobrança'}</label></div><p>Cálculo e guias do pró-labore.${D.socios.ativo===false?' Desativado: sócios não alteram o honorário.':''}</p><div class="fg keep"><label class="f">Incluídos na base${inp('socios.incluidos',D.socios.incluidos)}</label><label class="f">Por sócio adicional${money('socios.valor',D.socios.valor)}</label></div></div>
      <div class="pcard ${D.xml.ativo===false?'off':''}"><div class="pc-h"><h3>Blocos de XML</h3><label class="switch"><input type="checkbox" data-ns="par" data-path="xml.ativo" ${D.xml.ativo!==false?'checked':''} aria-label="Cobrar por quantidade de XML">${D.xml.ativo!==false?'Cobrando':'Sem cobrança'}</label></div><p>XMLs de entrada e saída importados por mês.${D.xml.ativo===false?' Desativado: a quantidade de XML não altera o honorário.':''}</p><div class="fg three"><label class="f">Franquia${inp('xml.franquia',D.xml.franquia,{step:10})}</label><label class="f">Tamanho do bloco${inp('xml.bloco',D.xml.bloco,{step:10})}</label><label class="f">Valor por bloco${money('xml.valorBloco',D.xml.valorBloco)}</label></div></div>
      <div class="pcard"><h3>Emissão de notas fiscais</h3><p>Quando o escritório emite as notas do cliente.</p><div class="fg three"><label class="f">Valor fixo${money('nf.fixo',D.nf.fixo)}</label><label class="f">Notas incluídas${inp('nf.franquia',D.nf.franquia)}</label><label class="f">Por nota adicional${money('nf.porNota',D.nf.porNota)}</label></div></div>
      <div class="pcard"><h3>Filiais</h3><p>Cada estabelecimento adicional. Você pode cobrar um valor fixo ou um percentual do honorário da matriz.</p>
        <div class="segctl" style="grid-template-columns:1fr 1fr" role="radiogroup" aria-label="Formato do valor da filial">
          <button type="button" role="radio" aria-checked="${(D.filial.modo||'fixo')!=='pct'}" class="${(D.filial.modo||'fixo')!=='pct'?'on':''}" data-act="par-set" data-path="filial.modo" data-v="fixo">Valor fixo</button>
          <button type="button" role="radio" aria-checked="${D.filial.modo==='pct'}" class="${D.filial.modo==='pct'?'on':''}" data-act="par-set" data-path="filial.modo" data-v="pct">% da matriz</button>
        </div>
        ${D.filial.modo==='pct'
          ?`<label class="f">Percentual por filial${pctIn('filial.pct',n(D.filial.pct??80),'Percentual da filial',1)}<span class="hint">Filial ativa: % do honorário da matriz (matriz R$ 2.000,00 a 80% → R$ 1.600,00). Filial inativa: o mesmo % sobre o valor de empresa inativa do regime (Simples R$ ${fmtMoney(n((D.inativa||{}).simples))} a ${numBR(n(D.filial.pct??80))}% → R$ ${fmtMoney(n((D.inativa||{}).simples)*n(D.filial.pct??80)/100)}).</span></label>`
          :`<div class="fg keep"><label class="f">Por filial ativa${money('filial.valor',D.filial.valor)}</label><label class="f">Por filial inativa${money('filial.valorInativa',D.filial.valorInativa??100)}</label></div>`}
      </div>
    </div>`;
  } else if(t==='complexidade'){
    body=`<div class="pcards">
      <div class="pcard"><h3>Fator de complexidade por regime</h3><p>Multiplica os adicionais por volume (funcionários, sócios, XML, notas e filiais). Use acima de 1 onde cada documento dá mais trabalho.</p>
        <div class="fg keep">${REGIMES.map(r=>`<label class="f">${r.nome}<div class="suffix">${inp('fatorRegime.'+r.id,n(D.fatorRegime[r.id]),{step:0.05,label:'Fator '+r.nome})}<span>×</span></div></label>`).join('')}</div></div>
      <div class="pcard"><h3>Horas × mão de obra</h3><p>Custo real da equipe por hora (salários, encargos e estrutura divididos pelas horas produtivas) e a margem que você quer sobre ele.</p>
        <div class="fg keep"><label class="f">Custo por hora${money('horas.custoHora',D.horas.custoHora,'Custo por hora')}</label><label class="f">Margem desejada${pctIn('horas.margem',D.horas.margem,'Margem')}</label></div>
        <label class="f">Como usar as horas no preço<select data-ns="par" data-path="horas.metodo"><option value="maior" ${D.horas.metodo==='maior'?'selected':''}>Vale o maior: tabela ou horas</option><option value="horas" ${D.horas.metodo==='horas'?'selected':''}>Vale sempre o cálculo por horas</option><option value="tabela" ${D.horas.metodo==='tabela'?'selected':''}>Vale a tabela; horas só mostram a margem</option></select></label>
        <span class="hint muted" style="font-size:12.5px">Exemplo: 10 h × ${brl(n(D.horas.custoHora))} = ${brl(10*n(D.horas.custoHora))} de custo → ${brl(10*n(D.horas.custoHora)/(1-Math.min(90,n(D.horas.margem))/100))} com ${numBR(n(D.horas.margem))}% de margem.</span></div>
    </div>`;
  } else if(t==='faixas'){
    const fs=sortFaixas(D.faixasSimples||[]).map(f=>{const i=(D.faixasSimples||[]).indexOf(f);return {f,i}});
    const regCard=(key,nome,desc)=>{const L=D[key]||[];const rows=sortFaixas(L).map(f=>({f,i:L.indexOf(f)}));
      return `<div class="pcard"><div class="card-head" style="padding:0;margin:0;border:0"><div><h3>${nome}</h3><p>${desc}</p></div><button class="btn sm" data-act="par-add-faixa-reg" data-list="${key}">${I.plus}Faixa</button></div>
        <div class="scroll-x"><table class="ptable" style="min-width:420px"><thead><tr><th style="width:44%">Faturamento até</th><th>Acréscimo</th><th class="td-acoes">Ações</th></tr></thead><tbody>
        ${rows.map(({f,i})=>`<tr><td>${f.ate==null?`<span class="muted">Acima da faixa anterior</span>`:money(key+'.'+i+'.ate',n(f.ate),'Limite da faixa')}</td><td>${pctIn(key+'.'+i+'.pct',n(f.pct),'Acréscimo '+nome)}</td><td class="td-acoes">${f.ate==null?'':`<button class="btn sm danger faixa-del" data-act="par-del" data-list="${key}" data-i="${i}" title="Remover faixa">${I.trash}Remover</button>`}</td></tr>`).join('')}
        </tbody></table></div></div>`;};
    body=`<section class="card"><div class="card-head"><div><h2>Faixas de faturamento mensal</h2><p>Acréscimo sobre o valor base conforme o faturamento médio, respeitando o limite de cada regime.</p></div></div>
    <div class="faixa-blocos">
      <div class="pcard faixa-mei"><h3>MEI</h3><p>Sem faixas de faturamento. O honorário do MEI não varia com o faturamento — vale só o valor base do segmento.</p></div>
      <div class="pcard"><div class="card-head" style="padding:0;margin:0;border:0"><div><h3>Simples Nacional</h3><p>Só pode faturar até <strong>${brl0(SIMPLES_FAT_MAX)}</strong> por mês. Configure as faixas dentro desse teto.</p></div><button class="btn sm" data-act="par-add-faixa-simples">${I.plus}Faixa</button></div>
        <div class="scroll-x"><table class="ptable" style="min-width:420px"><thead><tr><th style="width:44%">Faturamento até</th><th>Acréscimo</th><th class="td-acoes">Ações</th></tr></thead><tbody>
        ${fs.map(({f,i})=>`<tr><td>${money('faixasSimples.'+i+'.ate',n(f.ate),'Limite da faixa')}</td><td>${pctIn('faixasSimples.'+i+'.pct',n(f.pct),'Acréscimo Simples')}</td><td class="td-acoes">${fs.length>1?`<button class="btn sm danger faixa-del" data-act="par-del" data-list="faixasSimples" data-i="${i}" title="Remover faixa">${I.trash}Remover</button>`:''}</td></tr>`).join('')}
        </tbody></table></div></div>
      ${regCard('faixasPresumido','Lucro Presumido','Faixas próprias do Lucro Presumido. A última vale para tudo acima do limite anterior.')}
      ${regCard('faixasReal','Lucro Real','Faixas próprias do Lucro Real. A última vale para tudo acima do limite anterior.')}
    </div></section>`;
  } else if(t==='servicos'){
    body=`<section class="card"><div class="card-head"><div><h2>Serviços adicionais</h2><p>Itens opcionais que entram no cálculo, nos planos e na proposta.</p></div><button class="btn sm" data-act="par-add-serv">${I.plus}Serviço</button></div>
    ${D.servicos.length?`<div class="scroll-x"><table class="ptable" style="min-width:420px"><thead><tr><th>Serviço</th><th style="width:180px">Valor mensal</th><th></th></tr></thead><tbody>${D.servicos.map((s,i)=>`<tr><td>${inp('servicos.'+i+'.nome',s.nome,{type:'text',label:'Nome do serviço'})}</td><td>${money('servicos.'+i+'.valor',n(s.valor),'Valor')}</td><td><button class="icon-btn" data-act="par-del" data-list="servicos" data-i="${i}" aria-label="Remover serviço">${I.trash}</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">Nenhum serviço adicional.</p>'}</section>`;
  } else if(t==='anomalias'){
    body=`<section class="card"><div class="card-head"><div><h2>Taxas de exceção</h2><p>Percentual extra para clientes que entregam documentos fora do prazo, desorganizados ou que geram retrabalho. Marque no cadastro do cliente ou no cálculo.</p></div><button class="btn sm" data-act="par-add-anom">${I.plus}Exceção</button></div>
    ${D.anomalias.length?`<div class="scroll-x"><table class="ptable" style="min-width:420px"><thead><tr><th>Situação</th><th style="width:160px">Acréscimo</th><th></th></tr></thead><tbody>${D.anomalias.map((a,i)=>`<tr><td>${inp('anomalias.'+i+'.nome',a.nome,{type:'text',label:'Situação'})}</td><td>${pctIn('anomalias.'+i+'.pct',n(a.pct),'Acréscimo')}</td><td><button class="icon-btn" data-act="par-del" data-list="anomalias" data-i="${i}" aria-label="Remover exceção">${I.trash}</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">Nenhuma taxa de exceção cadastrada.</p>'}</section>`;
  } else if(t==='planos'){
    body=`<section class="card"><div class="card-head"><div><h2>Planos de venda</h2><p>Monte até três níveis com o que você quer ofertar em cada um. O orçamento gera os três preços para o mesmo cliente e a proposta apresenta lado a lado.</p></div>
      <label class="switch"><input type="checkbox" data-ns="par" data-path="planos.ativo" ${D.planos.ativo?'checked':''}>Ofertar em planos</label></div>
      <div class="plan-edit">${D.planos.niveis.map((p,i)=>`<div class="pcard ${p.ativo?'':'off'} ${p.destaque?'dest':''}">
        <label class="switch" style="font-size:13.5px"><input type="checkbox" data-ns="par" data-path="planos.niveis.${i}.ativo" ${p.ativo?'checked':''}>Nível ${i+1} ativo</label>
        <label class="f">Nome do plano${inp('planos.niveis.'+i+'.nome',p.nome,{type:'text',label:'Nome do plano'})}</label>
        <label class="f">Descrição curta${inp('planos.niveis.'+i+'.descricao',p.descricao||'',{type:'text',label:'Descrição'})}</label>
        <label class="switch" style="font-size:13.5px"><input type="checkbox" data-ns="par" data-path="planos.niveis.${i}.emiteNF" ${p.emiteNF?'checked':''}>Inclui emissão de notas fiscais</label>
        <div class="f"><span>Serviços incluídos</span><div class="chips">${D.servicos.map(s=>`<label class="chip" style="font-size:12.5px;padding:5px 10px"><input type="checkbox" data-ns="par" data-arr="planos.niveis.${i}.servicos" data-v="${esc(s.id)}" ${(p.servicos||[]).includes(s.id)?'checked':''}>${esc(s.nome)}</label>`).join('')}</div></div>
        <label class="f">Ajuste sobre o preço calculado<div class="suffix"><input type="number" step="1" data-ns="par" data-path="planos.niveis.${i}.ajuste" value="${n(p.ajuste)}" aria-label="Ajuste"><span>%</span></div><span class="hint">Use negativo para desconto de pacote.</span></label>
        <label class="switch" style="font-size:13.5px"><input type="radio" name="plano-destaque" data-act-change="destaque" data-i="${i}" ${p.destaque?'checked':''}>Destacar como recomendado</label>
      </div>`).join('')}</div>
      <p class="muted" style="margin:14px 0 0;font-size:12.5px">Os planos partem do perfil do cliente (regime, faturamento, funcionários, XMLs) e trocam só notas e serviços. Desative níveis para ofertar apenas dois.</p>
    </section>`;
  } else if(t==='cobranca'){
    const I2=D.indices;
    body=`<div class="pcards">
      <div class="pcard"><h3>Parcelas por ano</h3><p>Define o total anual, os valores do painel e o texto padrão da proposta. Em cada orçamento você ainda pode trocar.</p>
        <div class="segctl" style="grid-template-columns:1fr 1fr" role="radiogroup" aria-label="Parcelas por ano"><button type="button" role="radio" aria-checked="${!D.decimoTerceiro}" class="${!D.decimoTerceiro?'on':''}" data-act="par-set" data-path="decimoTerceiro" data-v="false">12 parcelas</button><button type="button" role="radio" aria-checked="${!!D.decimoTerceiro}" class="${D.decimoTerceiro?'on':''}" data-act="par-set" data-path="decimoTerceiro" data-v="true">13 parcelas</button></div>
        <span class="hint muted" style="font-size:12.5px">${D.decimoTerceiro?'12 mensais + 13ª em dezembro, referente ao encerramento anual.':'12 mensais, sem 13ª parcela.'}</span></div>
      <div class="pcard"><h3>Dia de vencimento</h3><p>Dia do mês em que o honorário vence. Aparece nas condições da proposta.</p>
        <div class="segctl" style="grid-template-columns:1fr 1fr" role="radiogroup" aria-label="Dia de vencimento">${[10,20].map(d=>`<button type="button" role="radio" aria-checked="${(n(D.vencimento)||10)===d}" class="${(n(D.vencimento)||10)===d?'on':''}" data-act="par-set" data-path="vencimento" data-v="${d}">Dia ${d}</button>`).join('')}</div>
        <span class="hint muted" style="font-size:12.5px">Vencimento todo dia ${n(D.vencimento)||10} de cada mês. Orçamentos já salvos mantêm o dia de quando foram feitos.</span></div>
      <div class="pcard" style="grid-column:1/-1"><div class="pc-h"><h3>Limite do reajuste</h3><label class="switch"><input type="checkbox" data-ns="par" data-path="reajusteTeto" ${D.reajusteTeto!==false?'checked':''} aria-label="Limitar reajuste ao valor da tabela">${D.reajusteTeto!==false?'Ligado':'Desligado'}</label></div><p>O reajuste anual nunca passa do valor da tabela, ou seja, do que um contrato novo pagaria no mesmo perfil. Clientes antigos que já chegaram nesse valor ficam com o reajuste travado.</p></div>
      <div class="pcard"><h3>Quando reajustar</h3><p>Data usada nos alertas do painel e descrita na proposta.</p>
        <div class="segctl" style="grid-template-columns:1fr 1fr" role="radiogroup" aria-label="Periodicidade"><button type="button" role="radio" aria-checked="${I2.periodicidade!=='janeiro'}" class="${I2.periodicidade!=='janeiro'?'on':''}" data-act="par-set" data-path="indices.periodicidade" data-v="aniversario">A cada 12 meses</button><button type="button" role="radio" aria-checked="${I2.periodicidade==='janeiro'}" class="${I2.periodicidade==='janeiro'?'on':''}" data-act="par-set" data-path="indices.periodicidade" data-v="janeiro">Em janeiro de cada ano</button></div>
        <span class="hint muted" style="font-size:12.5px">${I2.periodicidade==='janeiro'?'Todos os contratos reajustam em janeiro. O aviso aparece a partir de dezembro.':'Cada contrato reajusta no aniversário da data de início ou do último reajuste.'}</span>
        ${I2.periodicidade==='janeiro'?`<label class="f" style="margin-top:12px">Contratos novos não reajustam no primeiro janeiro se começaram a partir de<select data-ns="par" data-path="indices.carencia"><option value="0" ${!carenciaMes(D)?'selected':''}>Sempre reajustar no primeiro janeiro</option>${MESES.slice(1).map((m,i)=>`<option value="${i+2}" ${carenciaMes(D)===i+2?'selected':''}>${m[0].toUpperCase()+m.slice(1)}</option>`).join('')}</select><span class="hint">${carenciaMes(D)?'Ex.: contrato iniciado em '+MESES[carenciaMes(D)-1]+' de 2026 tem o primeiro reajuste em janeiro de 2028. Iniciado antes disso, reajusta em janeiro de 2027.':'Todo contrato reajusta no primeiro janeiro, mesmo que tenha começado em dezembro.'}</span></label>`:''}</div>
      <div class="pcard" style="grid-column:1/-1"><h3>Percentual do reajuste anual</h3><p>Escolha um índice de inflação ou um percentual fixo definido por você.</p>
        <div class="segctl" style="grid-template-columns:repeat(3,minmax(0,1fr))" role="radiogroup" aria-label="Base do reajuste">${[['ipca','IPCA'],['igpm','IGP-M'],['fixo','Percentual fixo']].map(([id,l])=>`<button type="button" role="radio" aria-checked="${I2.usar===id}" class="${I2.usar===id?'on':''}" data-act="par-set" data-path="indices.usar" data-v="${id}">${l}</button>`).join('')}</div>
        <div class="fg three">
          <label class="f">IPCA 12 meses${pctIn('indices.ipca.pct',n(I2.ipca.pct),'IPCA',0.01)}</label>
          <label class="f">IGP-M 12 meses${pctIn('indices.igpm.pct',n(I2.igpm.pct),'IGP-M',0.01)}</label>
          <label class="f">Percentual fixo${pctIn('indices.fixo.pct',n(I2.fixo.pct),'Percentual fixo',0.5)}</label>
        </div>
        <label class="f">Referência dos índices${inp('indices.referencia',I2.referencia||'',{type:'text',label:'Referência',ph:'acumulado 12 meses até set/2026'})}</label>
        <div class="margin-line"><span>Texto na proposta</span><b style="font-weight:600">${esc(reajusteTexto(D))}</b></div>
        <p class="muted" style="margin:0;font-size:12.5px">Padrão inicial: IPCA 4,58% e IGP-M 3,34% acumulados em 12 meses até setembro de 2026 (IBGE e FGV). Atualize todo mês.</p></div>
      <div class="pcard"><h3>Descontos e reajustes</h3><p>Limites usados no orçamento e no plano de reajuste do painel.</p><div class="fg keep"><label class="f">Desconto máximo${pctIn('descontoMax',D.descontoMax,'Desconto máximo')}</label><label class="f">Aumento máximo por cliente${pctIn('reajusteMax',D.reajusteMax,'Reajuste máximo',5)}</label></div></div>
    </div>`;
  } else if(t==='regras'){
    body=`<div class="pcards">
      <div class="pcard"><h3>Arredondamento</h3><p>O valor final sobe para o próximo múltiplo.</p><label class="f">Arredondar para múltiplos de${money('arredondamento',D.arredondamento)}</label></div>
      <div class="pcard"><h3>Tolerância da comparação</h3><p>Diferença aceita para considerar o cliente alinhado.</p><label class="f">Tolerância${pctIn('tolerancia',D.tolerancia,'Tolerância')}</label></div>
    </div>`;
  } else {
    const pinp=(k,label,ph,type)=>`<label class="f" for="pf-${k}">${label}<input id="pf-${k}" type="${type||'text'}" data-ns="perf" data-path="${k}" value="${esc(PF[k])}" ${ph?`placeholder="${esc(ph)}"`:''}></label>`;
    const logoPrev=PF.logo?`<div class="logo-prev"><img src="${esc(PF.logo)}" alt="Logo do escritório"><button type="button" class="btn sm danger" data-act="logo-remover">Remover logo</button></div>`:`<p class="muted" style="margin:0;font-size:13px">Nenhuma logo enviada ainda.</p>`;
    body=`<section class="card"><div class="card-head"><div><h2>Dados do escritório</h2><p>Aparecem no cabeçalho e no texto das propostas.</p></div></div>
      <div class="form-groups">
      <div class="f"><span>Logo do escritório</span><span class="hint">PNG, JPG ou SVG. Aparece no cabeçalho das propostas geradas.</span>
        <div class="logo-row">${logoPrev}<label class="btn" for="pf-logo">${I.up}Escolher imagem</label><input id="pf-logo" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml,image/gif" hidden data-act-change="logo-file"></div>
      </div>
      ${pinp('nome','Nome do escritório')}<div class="fg">${pinp('crc','Registro CRC','PR-000000/O')}${pinp('cidade','Cidade','Campo Largo/PR')}</div><div class="fg">${pinp('telefone','Telefone ou WhatsApp','(41) 90000-0000')}${pinp('email','E-mail','contato@escritorio.com.br','email')}</div>
      <label class="f" for="pf-validadeDias">Validade padrão das propostas<div class="suffix"><input id="pf-validadeDias" type="number" min="1" data-ns="perf" data-path="validadeDias" value="${n(PF.validadeDias)}"><span>dias</span></div></label>
      <label class="f" for="pf-escopoExtra">Itens fixos do escopo <span class="hint">Um por linha. Entram em todas as propostas.</span><textarea id="pf-escopoExtra" data-ns="perf" data-path="escopoExtra">${esc(PF.escopoExtra)}</textarea></label>
      <label class="f" for="pf-condicoes">Condições comerciais <span class="hint">Uma por linha.</span><textarea id="pf-condicoes" data-ns="perf" data-path="condicoes">${esc(PF.condicoes)}</textarea></label></div>
    </section>`;
  }
  return `<div class="page-head"><div><p>A régua de preço do seu escritório. Toda alteração recalcula clientes, painel e novos orçamentos.</p></div><button class="btn" data-act="par-restaurar">Restaurar padrão</button></div>
  <div class="tabs" role="tablist">${tabs.map(([id,tt])=>`<button role="tab" aria-selected="${t===id}" class="${t===id?'on':''}" data-act="par-tab" data-v="${id}">${tt}</button>`).join('')}</div>
  ${body}
  <div id="savebar">${saveBarHTML()}</div>`;
}
function saveBarHTML(){

function normTxt(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim()}
function splitLine(l,d){const out=[];let cur='',q=false;for(let i=0;i<l.length;i++){const ch=l[i];if(ch==='"'){if(q&&l[i+1]==='"'){cur+='"';i++}else q=!q}else if(ch===d&&!q){out.push(cur);cur=''}else cur+=ch}out.push(cur);return out.map(x=>x.trim())}

  let cols=CSV_HEAD.split(';'),start=0;

  const map={nome:['nome','razao social','razao','cliente','empresa'],cnpj:['cnpj','cpf/cnpj','documento','cnpj/cpf'],inativa:['inativa','inativo','situacao','sem movimento'],segmento:['segmento','atividade','ramo'],regime:['regime','regime tributario','tributacao'],funcionarios:['funcionarios','func','empregados','colaboradores'],socios:['socios','pro-labore','prolabore','pro labore'],xml:['xml','xmls','quantidade de xml','qtd xml'],emite_nf:['emite_nf','emite nf','emissao','emissao de nf','emite nota','emite notas'],notas:['notas','nfs','notas emitidas','qtd notas'],faturamento:['faturamento','faturamento mensal','receita','faturamento medio'],honorario_atual:['honorario_atual','honorario atual','honorario','valor','mensalidade','honorarios'],data_contrato:['data_contrato','data contrato','inicio do contrato','data do contrato','ultimo reajuste','data_reajuste','inicio'],horas:['horas','horas mes','horas/mes','horas estimadas'],contato:['contato','telefone','email','e-mail','whatsapp']};

  const rows=[],erros=[];

    const inT=normTxt(o.inativa);
    rows.push(Object.assign(defaultInput(),{inativa:['sim','s','1','x','true','inativa','inativo','sem movimento'].includes(inT),nome:o.nome,cnpj:o.cnpj||'',contato:o.contato||'',obs:'',segmento:(seg||state.params.segmentos[0]).id,regime,
      funcionarios:Math.round(n(o.funcionarios)),socios:o.socios==null||o.socios===''?1:Math.round(n(o.socios)),xml:Math.round(n(o.xml)),
      emiteNF:['sim','s','1','x','true','yes'].includes(normTxt(o.emite_nf)),notas:Math.round(n(o.notas)),faturamento:n(o.faturamento),filiais:0,filiaisInativas:0,servicos:[],anomalias:[],

function redimensionarLogo(dataUrl,max){
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>{
      let w=img.width,h=img.height;
      if(w<=max&&h<=max&&dataUrl.length<220000){res(dataUrl);return}
      const scale=Math.min(max/w,max/h,1);w=Math.max(1,Math.round(w*scale));h=Math.max(1,Math.round(h*scale));
      const c=document.createElement('canvas');c.width=w;c.height=h;
      const ctx=c.getContext('2d');ctx.fillStyle='#FFFFFF';ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);
      let out=c.toDataURL('image/jpeg',0.85);
      if(out.length>180000)out=c.toDataURL('image/jpeg',0.7);
      res(out);
    };
    img.onerror=()=>rej(new Error('img'));
  img.src=dataUrl;
  });
}

  const t=e.target, a=t.dataset.actChange;
  if(a==='merc-cap'){setCapital(t.value);return}
  if(a==='logo-file'){const f=t.files&&t.files[0];if(f)lerLogoArquivo(f);t.value='';return}
  if(a==='ordem'){state.ordem=t.value;render()}
  else if(a==='orc-comp'){const o=state.orcamentos.find(x=>x.id===state.edit.id);if(o)Store.put('orcamentos',o.id,Object.assign({},o,{mostrarComposicao:t.checked})).then(()=>renderModal())}
  else if(a==='orc-plano'){const o=state.orcamentos.find(x=>x.id===state.edit.id);if(!o)return;const p=(o.planos||[]).find(x=>x.id===t.value);
    Store.put('orcamentos',o.id,Object.assign({},o,{planoEscolhido:p?p.id:null,valor:p?n(p.valor):n(((o.planos||[]).find(x=>x.destaque)||{}).valor||o.valor)})).then(()=>{renderModal();if(p)toast('Plano '+p.nome+' registrado')})}
  else if(a==='orc-planos'){state.edit.ofertarPlanos=t.checked;renderModal()}
  else if(a==='grp-toggle'){const ns=t.dataset.ns2,g=t.dataset.g;state.grpOpen=Object.assign({},state.grpOpen,{[ns+':'+g]:t.checked});if(!t.checked){const tg=tgtOf(ns);if(tg)tg[g==='serv'?'servicos':'anomalias']=[]}refreshNs(ns,true)}
  else if(a==='calc-planos'){state.calc.ofertarPlanos=t.checked;refreshNs('calc')}
  else if(a==='calc-ab'){state.calc.aberturaOn=t.checked;const y=window.scrollY;render();window.scrollTo(0,y);if(t.checked)setTimeout(()=>document.getElementById('o-abv')?.focus(),0)}
  else if(a==='destaque'){state.paramsDraft.planos.niveis.forEach((p,i)=>p.destaque=i===Number(t.dataset.i));markDirty();const y=window.scrollY;render();window.scrollTo(0,y)}
  else if(a==='imp-file'){const f=t.files&&t.files[0];if(f)lerArquivo(f)}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.modal&&state.modal!=='confirm')closeModal()});
document.addEventListener('mouseover',e=>{const tip=document.getElementById('tip');if(!tip)return;const el=e.target.closest('[data-tip]');if(!el){tip.hidden=true;return}tip.textContent=el.dataset.tip;tip.hidden=false});
document.addEventListener('mouseout',e=>{const tip=document.getElementById('tip');if(!tip||tip.hidden)return;if(!e.relatedTarget||!e.relatedTarget.closest||!e.relatedTarget.closest('[data-tip]'))tip.hidden=true});
document.addEventListener('mousemove',e=>{const tip=document.getElementById('tip');if(!tip||tip.hidden)return;const w=tip.offsetWidth;let x=e.clientX+14;if(x+w>window.innerWidth-8)x=e.clientX-w-14;tip.style.left=x+'px';tip.style.top=(e.clientY+16)+'px'});

document.addEventListener('click',async e=>{
  const nav=e.target.closest('[data-nav]');if(nav){e.preventDefault();if(state.modal)closeModal();if(nav.dataset.ptab)state.paramsTab=nav.dataset.ptab;if(nav.dataset.nav===state.view&&state.view!=='parametros'&&!nav.dataset.ptab&&nav.dataset.tab===state.orcTab&&nav.dataset.nav==='orcar')return;go(nav.dataset.nav,nav.dataset.tab);return}
  const a=e.target.closest('[data-act]');if(!a)return;
  const act=a.dataset.act;
  if(act==='close-bg'){if(e.target===a)closeModal();return}
  switch(act){
    case 'close':if(state.modal==='copiar'&&state.modalPrev){state.modal=state.modalPrev;state.modalPrev=null;renderModal()}else closeModal();break;
    case 'set':{const tgt=tgtOf(a.dataset.ns);tgt[a.dataset.k]=a.dataset.v;refreshNs(a.dataset.ns,true);break}
    case 'step':{const ns=a.dataset.ns,k=a.dataset.k,tgt=tgtOf(ns);tgt[k]=Math.max(0,Math.round(n(tgt[k]))+Number(a.dataset.d));const inp=document.getElementById(ns+'-'+k);if(inp)inp.value=tgt[k];refreshNs(ns);break}
    case 'rapido':state.modal='rapido';renderModal();break;
    case 'quick-copiar':copiar(quickResumo(),'Resumo copiado');break;
    case 'quick-detalhar':state.calc=Object.assign(defaultInput(),clone(state.quick),{atual:'',valorProposto:null,precoManual:false});closeModal();go('orcar','novo');break;
    case 'quick-orc':openNovoOrc(state.quick);break;
    case 'calc-limpar':state.grpOpen={};state.calc=Object.assign(defaultInput(),{valorProposto:null,precoManual:false});render();break;
    case 'calc-preco-reset':state.calc.precoManual=false;state.calc.valorProposto=calcular(state.calc).total;refreshNs('calc');break;
    case 'calc-cliente':openCliente(null,pickInp(state.calc));break;
    case 'novo-orc':openNovoOrc(state.calc);break;
    case 'save-orc':saveOrc();break;
    case 'salvar-orc-calc':salvarOrcCalc();break;
    case 'calc-inicio':{state.calc.inicioCobranca=iniClamp(a.dataset.v);const y=window.scrollY;render();window.scrollTo(0,y);break}
    case 'calc-parc':{state.calc.decimoTerceiro=a.dataset.v==='13';const y=window.scrollY;render();window.scrollTo(0,y);break}
    case 'novo-cli':openCliente(null);break;
    case 'edit-cli':openCliente(a.dataset.id);break;
    case 'save-cli':saveCliente();break;
    case 'reaj-aplicar':aplicarReajuste(a.dataset.id,a.dataset.tipo);break;
    case 'del-cli-ask':askConfirm('Excluir cliente?','“'+(state.edit.nome||'Cliente')+'” sai da carteira e do painel. Isso não pode ser desfeito.','Excluir cliente',async()=>{if(await Store.del('clientes',state.edit.id)){closeModal();toast('Cliente excluído')}});break;
    case 'cli-orc':{const c=state.edit,r=calcular(c),m=metricas(c),rmax=n(state.params.reajusteMax);const alvo=m.atual>0?Math.min(r.total,Math.max(m.atual,Math.ceil(m.atual*(1+rmax/100)/10)*10)):r.total;openNovoOrc(c,{prospect:c.nome,contato:c.contato||'',valor:Math.round(alvo*100)/100,origemCliente:c.id||null,ofertarPlanos:false});break}
    case 'confirm-no':state.modal=state.modalPrev;renderModal();break;
    case 'confirm-yes':{state.modal=state.modalPrev;const cb=confirmCb;confirmCb=null;renderModal();if(cb)await cb();renderModal();break}
    case 'filtro':state.filtro=a.dataset.v;render();break;
    case 'ver-reajustes':state.filtro='reajuste';go('clientes');break;
    case 'merc-cap':setCapital(a.dataset.v);break;
    case 'termo-base':state.termoBase=a.dataset.v;{const y=window.scrollY;render();window.scrollTo(0,y)}break;
    case 'merc-todas':state.modal='mercado';renderModal();break;
    case 'ver-abaixo':state.filtro='abaixo';state.ordem='gap';go('clientes');break;
    case 'importar':state.edit={txt:''};state.modal='importar';renderModal();break;
    case 'imp-confirmar':confirmarImport();break;
    case 'copiar-modelo':copiar(CSV_HEAD+'\n','Cabeçalho copiado. Cole na primeira linha da planilha.');break;
    case 'exportar':exportar();break;
    case 'orc-filtro':state.orcFiltro=a.dataset.v;render();break;
    case 'ver-orc':state.edit={id:a.dataset.id};state.modal='proposta';renderModal();break;
    case 'orc-status':{const o=state.orcamentos.find(x=>x.id===state.edit.id);if(o&&o.status!==a.dataset.v){if(await Store.put('orcamentos',o.id,Object.assign({},o,{status:a.dataset.v,atualizadoEm:new Date().toISOString()}))){toast('Status: '+a.textContent.trim());renderModal()}}break}
    case 'orc-copiar':{const o=state.orcamentos.find(x=>x.id===state.edit.id);if(!o)break;await copiar(mensagem(o),'Mensagem copiada. Cole no WhatsApp ou no e-mail.');if(o.status==='rascunho'&&state.modal==='proposta'){await Store.put('orcamentos',o.id,Object.assign({},o,{status:'enviado'}));renderModal()}break}
    case 'orc-baixar':{const o=state.orcamentos.find(x=>x.id===state.edit.id);if(o)await baixar('Proposta '+o.numero+' - '+String(o.prospect).replace(/[\\/:*?"<>|]/g,'')+'.html',proposalFile(o));break}
    case 'orc-duplicar':{const o=state.orcamentos.find(x=>x.id===state.edit.id);if(!o)break;const base=Object.assign(defaultInput(),clone(o.inp||{}),{atual:''});const sug=calcular(base).total;const val=n(o.valor);state.calc=Object.assign(base,{valorProposto:val||sug,precoManual:val>0&&Math.abs(val-sug)>0.009,prospect:o.prospect||'',contato:o.contato||'',decimoTerceiro:o.decimoTerceiro,aberturaOn:!!o.abertura,aberturaValor:o.abertura?n(o.abertura.valor):0,aberturaParcelas:o.abertura?n(o.abertura.parcelas):1,inicioCobranca:iniClamp(o.inicioCobranca)});closeModal();go('orcar','novo');toast('Dados da proposta '+o.numero+' carregados');break}
    case 'orc-parc':state.edit.decimoTerceiro=a.dataset.v==='13';renderModal();break;
    case 'orc-converter':{const o=state.orcamentos.find(x=>x.id===state.edit.id);if(!o)break;
      const pl=(o.planos||[]), p=pl.find(x=>x.id===o.planoEscolhido)||pl.find(x=>x.destaque)||null;
      const inpF=p?p.inp:o.inp, valF=p?n(p.valor):n(o.valor);
      const id=o.origemCliente&&state.clientes.find(c=>c.id===o.origemCliente)?o.origemCliente:uid();const ex=state.clientes.find(c=>c.id===id);const now=new Date().toISOString();
      const body=Object.assign({},ex||{nome:o.prospect,cnpj:'',contato:o.contato||'',obs:'Cliente desde a proposta '+o.numero+(p?' (plano '+p.nome+')':''),criadoEm:now},pickInp(inpF),{atual:valF,dataReajuste:hojeISO(),atualizadoEm:now});delete body.id;
      if(await Store.put('clientes',id,body)){await Store.put('orcamentos',o.id,Object.assign({},o,{clienteId:id}));toast(ex?'Honorário do cliente atualizado':'Cliente cadastrado na carteira');renderModal()}break}
    case 'del-orc-ask':{const o=state.orcamentos.find(x=>x.id===state.edit.id);askConfirm('Excluir orçamento?','A proposta '+(o?o.numero:'')+' será removida. Isso não pode ser desfeito.','Excluir orçamento',async()=>{if(await Store.del('orcamentos',state.edit.id)){closeModal();toast('Orçamento excluído')}});break}
    case 'par-set':{let v=a.dataset.v;if(v==='true')v=true;else if(v==='false')v=false;setPath(state.paramsDraft,a.dataset.path,v);markDirty();const y=window.scrollY;render();window.scrollTo(0,y);break}
    case 'par-tab':state.paramsTab=a.dataset.v;render();break;
    case 'par-add-seg':state.paramsDraft.segmentos.push({id:'seg-'+uid().slice(0,6),nome:'Novo segmento',base:{mei:0,simples:0,presumido:0,real:0}});markDirty();render();break;
    case 'par-add-faixa-simples':{
      const fx=state.paramsDraft.faixasSimples||(state.paramsDraft.faixasSimples=[]);
      const lims=fx.map(f=>n(f.ate)).filter(v=>v>0);const mx=lims.length?Math.max(...lims):0;
      if(mx>=SIMPLES_FAT_MAX){toast('Simples Nacional já está no teto de R$ 400 mil/mês.');break}
      const next=mx?Math.min(SIMPLES_FAT_MAX,mx>=200000?SIMPLES_FAT_MAX:mx*2):30000;
      fx.push({ate:next,pct:0});markDirty();render();break}
    case 'par-add-faixa-reg':{
      const key=a.dataset.list, fx=state.paramsDraft[key]||(state.paramsDraft[key]=[{ate:null,pct:0}]);
      const lims=fx.filter(f=>f.ate!=null).map(f=>n(f.ate));const mx=lims.length?Math.max(...lims):0;
      fx.push({ate:mx?mx*2:30000,pct:0});markDirty();const y=window.scrollY;render();window.scrollTo(0,y);break}
    case 'par-add-serv':state.paramsDraft.servicos.push({id:'sv-'+uid().slice(0,6),nome:'Novo serviço',valor:0});markDirty();render();break;
    case 'par-add-anom':state.paramsDraft.anomalias.push({id:'an-'+uid().slice(0,6),nome:'Nova exceção',pct:10});markDirty();render();break;
    case 'par-del':state.paramsDraft[a.dataset.list].splice(Number(a.dataset.i),1);markDirty();render();break;
    case 'logo-remover':if(state.perfilDraft){state.perfilDraft.logo='';markDirty();const y=window.scrollY;render();window.scrollTo(0,y);toast('Logo removida. Salve os parâmetros para confirmar.')}break;
    case 'par-descartar':state.paramsDraft=clone(state.params);state.perfilDraft=clone(state.perfil);state.dirty=false;render();toast('Alterações descartadas');break;
    case 'par-restaurar':askConfirm('Restaurar parâmetros padrão?','Valores base, adicionais, faixas, serviços, anomalias, planos, índices e regras voltam ao padrão sugerido. Nada é salvo até você tocar em “Salvar parâmetros”.','Restaurar',async()=>{state.paramsDraft=clone(DEFAULT_PARAMS);state.dirty=true;render()},'primary');break;
    case 'par-salvar':{
      const D=state.paramsDraft;D.segmentos.forEach(s=>{s.nome=String(s.nome||'').trim()||'Segmento sem nome'});D.servicos=D.servicos.filter(s=>String(s.nome||'').trim());D.anomalias=D.anomalias.filter(s=>String(s.nome||'').trim());
      D.faixasSimples=normalizeFaixasSimples(D.faixasSimples);
      D.faixasPresumido=normalizeFaixasRegime(D.faixasPresumido);D.faixasReal=normalizeFaixasRegime(D.faixasReal);delete D.faixasLucro;
      delete D.faixas;
      const ok1=await Store.put('config','params',D),ok2=true;
      if(ok1&&ok2){state.dirty=false;state.paramsDraft=null;state.perfilDraft=null;toast('Parâmetros salvos. Carteira recalculada.');render()}break}
    case 'limpar-exemplos':askConfirm('Remover exemplos?','Os clientes e orçamentos marcados como exemplo serão excluídos. Seus próprios cadastros continuam.','Remover exemplos',async()=>{let q=0;for(const c of state.clientes.filter(x=>x.exemplo)){if(await Store.del('clientes',c.id))q++}for(const o of state.orcamentos.filter(x=>x.exemplo)){if(await Store.del('orcamentos',o.id))q++}closeModal();toast(q+' exemplos removidos')});break;
  }
});

/* ================= início ================= */
renderChrome();
Store.init();

    </script>
