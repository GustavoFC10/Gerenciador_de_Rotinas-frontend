<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Processos Jaralcon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
<style>
/* Tema sempre claro, como o Rotinas. Layout: mesmo sistema do app Rotinas — barra lateral branca de 272px, topo fixo, conteúdo em painéis brancos sobre fundo cinza-azulado */
:root{
  --app-bg:#f1f5f9; --sidebar-bg:#fff; --sidebar-border:#dbe3ed; --section-text:#64748b;
  --primary-bg:#f1f7ff; --primary-hover:#e5f0ff; --primary-border:#c7dcfa; --primary-text:#1e3a8a; --primary-muted:#526987;
  --topbar-bg:rgba(255,255,255,.96); --panel:#fff; --panel-soft:#f8fafc; --panel-border:#cbd5e1; --divider:#e2e8f0;
  --text-main:#020617; --text-strong:#0f172a; --text-muted:#64748b; --text-subtle:#94a3b8;
  --brand:#2563eb; --brand-strong:#1e40af; --brand-soft:#dbeafe; --brand-border:#93c5fd; --brand-hover:#1d4ed8;
  --nav-hover:#f8fafc; --nav-active:#eff6ff; --nav-text:#475569;
  --control:#fff; --control-border:#cbd5e1; --focus-ring:#2563eb33;
  --pend-bg:#fff; --pend-border:#cbd5e1; --pend-text:#334155; --pend-dot:#cbd5e1;
  --prog-bg:#fefce8; --prog-border:#facc15; --prog-text:#713f12; --prog-dot:#eab308;
  --err-bg:#fef2f2; --err-border:#fca5a5; --err-text:#991b1b; --err-dot:#ef4444; --err-strong:#dc2626;
  --ok-bg:#ecfdf5; --ok-border:#6ee7b7; --ok-text:#065f46; --ok-dot:#10b981; --ok-strong:#059669;
  --sch-bg:#f5f8f6; --sch-border:#cfdcd4; --sch-text:#466b55; --sch-dot:#a9c3b3; --sch-strong:#8fb09c;
  --act:#ea580c; --act-bg:#fff7ed; --act-border:#fdba74; --act-text:#9a3412; --act-ring:#ea580c2e;
  --com:#6366f1; --fin:#10b981; --reg:#f59e0b;
  --shadow-panel:0 1px 2px #0f172a14; --shadow-floating:0 16px 40px #0f172a29; --overlay:#0f172a59;
  --r-panel:12px; --r-control:8px;
  color-scheme:light;
  --font:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{background:var(--app-bg);color:var(--text-main)}
body{font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
body{cursor:default}
input,textarea,select,[contenteditable]{cursor:text}
select,input[type=date],input[type=checkbox],input[type=radio]{cursor:pointer}
button *,a *{cursor:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}

/* Barra lateral */
.side{position:fixed;inset:0 auto 0 0;width:272px;z-index:60;background:var(--sidebar-bg);border-right:1px solid var(--sidebar-border);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);transition:transform .2s}
.side-head{display:flex;align-items:center;gap:10px;height:72px;padding:0 12px;border:0;border-bottom:1px solid var(--divider);flex:none;width:100%;background:transparent;font:inherit;text-align:left;cursor:pointer}
.side-head:hover .logo{background:var(--brand);color:#fff}
.side-head:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
.logo{transition:background .15s,color .15s}
.logo{width:38px;height:38px;border-radius:var(--r-control);display:grid;place-items:center;background:var(--brand-soft);color:var(--brand)}
.side-head b{display:block;font-size:16px;font-weight:800;color:var(--text-strong);line-height:1.2}
.side-head small{display:block;font-size:12px;font-weight:500;color:var(--text-muted)}
.side-scroll{flex:1;overflow-y:auto;padding:16px 12px}
.sec-t{margin:0 0 8px;padding:0 8px;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--section-text)}
.side section{margin-bottom:20px}
.nav-i{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:0 12px;border-radius:var(--r-control);font-size:15.2px;font-weight:600;color:var(--nav-text);text-align:left;border:1px solid transparent;transition:background .15s}
.nav-i:hover{background:var(--nav-hover);color:var(--text-strong)}
.nav-i[aria-current="true"]{background:var(--nav-active);color:var(--text-strong);border-color:var(--brand-border)}
.nav-i .ct{margin-left:auto;min-width:24px;height:22px;padding:0 7px;border-radius:999px;display:inline-grid;place-items:center;font-size:12px;font-weight:700;background:var(--panel-soft);color:var(--text-muted);box-shadow:inset 0 0 0 1px var(--panel-border)}
.nav-i .ct.err{background:var(--err-bg);color:var(--err-text);box-shadow:inset 0 0 0 1px var(--err-border)}
.nav-i.sm{min-height:40px;font-size:14px}
.dept-card{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:10px 12px;border-radius:var(--r-control);border:1px solid var(--primary-border);background:var(--primary-bg);color:var(--primary-text);text-align:left;font-weight:600;transition:background .15s}
.dept-card:hover{background:var(--primary-hover)}
.dept-card .ico{width:36px;height:36px;border-radius:var(--r-control);background:var(--panel);display:grid;place-items:center;color:var(--brand);flex:none;box-shadow:inset 0 0 0 1px var(--primary-border)}
.dept-card b{display:block;font-size:16px}
.dept-card small{display:block;font-size:12px;color:var(--primary-muted);font-weight:500}
.dept-card .chev{margin-left:auto;color:var(--primary-muted)}
.dept-menu{margin-top:6px;border:1px solid var(--panel-border);border-radius:var(--r-control);background:var(--panel);overflow:hidden;box-shadow:var(--shadow-panel)}
.dept-menu button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;font-weight:600;color:var(--nav-text);text-align:left}
.dept-menu button + button{border-top:1px solid var(--divider)}
.dept-menu button:hover{background:var(--nav-hover)}
.dept-menu button[aria-checked="true"]{color:var(--brand)}
.side-foot{border-top:1px solid var(--divider);padding:10px 12px;flex:none}
.user{display:flex;align-items:center;gap:12px;padding:8px;border-radius:var(--r-control)}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);font-weight:800;font-size:13px;flex:none;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.user b{display:block;font-size:14px;font-weight:700;color:var(--text-strong)}
.user small{display:block;font-size:12px;color:var(--text-muted)}
.scrim{position:fixed;inset:0;background:var(--overlay);z-index:55}

/* Topo e conteúdo */
.shell{margin-left:272px;min-height:100%}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;min-height:72px;display:flex;align-items:center;gap:12px;background:var(--topbar-bg);backdrop-filter:blur(8px);border-bottom:1px solid var(--divider);padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:41;background:var(--sidebar-bg)}
.menu-btn{display:none;width:36px;height:36px;border-radius:var(--r-control);place-items:center;color:var(--text-muted)}
.menu-btn:hover{background:var(--nav-hover)}
.search{position:relative;flex:1;max-width:440px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-subtle);width:16px;height:16px}
.input,.search input,select.input,textarea.input{width:100%;min-height:36px;border:1px solid var(--control-border);background:var(--control);border-radius:var(--r-control);padding:0 12px;font-size:14px;color:var(--text-strong);outline:none;transition:border-color .15s,box-shadow .15s}
.search input{padding-left:34px;min-height:40px}
.input:focus,.search input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--focus-ring)}
.input::placeholder,.search input::placeholder{color:var(--text-subtle)}
textarea.input{padding:9px 12px;resize:vertical;min-height:80px;line-height:1.45}
.top .sp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:36px;padding:0 14px;border-radius:var(--r-control);font-size:14px;font-weight:700;border:1px solid var(--control-border);background:var(--control);color:var(--text-strong);transition:background .15s,border-color .15s;white-space:nowrap}
.btn:hover{background:var(--panel-soft)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-hover)}
.btn.sm{min-height:32px;padding:0 10px;font-size:12px}
.btn.danger{color:var(--err-text);border-color:var(--err-border)}
.btn.danger:hover{background:var(--err-bg)}
.btn:disabled{opacity:.6;cursor:not-allowed}
main{padding:20px max(32px,env(safe-area-inset-right,0px)) 48px max(32px,env(safe-area-inset-left,0px))}
.page-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.page-h h1{margin:0;font-size:24px;line-height:28px;font-weight:800;letter-spacing:-.02em;color:var(--text-strong)}
.page-h .meta{margin-left:auto;font-size:14px;color:var(--text-muted)}
.banner{margin-bottom:16px;padding:10px 14px;border-radius:var(--r-control);border:1px solid var(--prog-border);background:var(--prog-bg);color:var(--prog-text);font-size:13px;font-weight:500}

.panel{background:var(--panel);border:1px solid var(--panel-border);border-radius:var(--r-panel);box-shadow:var(--shadow-panel);overflow:hidden}
.panel-h{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--divider)}
.panel-h h2{margin:0;font-size:18px;font-weight:800;color:var(--text-strong)}
.pill{display:inline-flex;align-items:center;min-height:28px;padding:0 10px;border-radius:999px;background:var(--panel-soft);color:var(--text-muted);font-size:12px;font-weight:700;box-shadow:inset 0 0 0 1px var(--panel-border);white-space:nowrap}
.panel-h .pill{margin-left:auto}
.badge{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:7.25rem;padding:4px 10px;border-radius:999px;border:1px solid;font-size:12px;font-weight:700;white-space:nowrap}
.badge.pending{background:var(--pend-bg);border-color:var(--pend-border);color:var(--pend-text)}
.badge.progress{background:var(--prog-bg);border-color:var(--prog-border);color:var(--prog-text)}
.badge.error{background:var(--err-bg);border-color:var(--err-border);color:var(--err-text)}
.badge.completed{background:var(--ok-bg);border-color:var(--ok-border);color:var(--ok-text)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.dot.com{background:var(--com)}.dot.fin{background:var(--fin)}.dot.reg{background:var(--reg)}

/* Início */
.home{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
.prow{display:flex;align-items:center;gap:12px;width:100%;padding:14px 20px;text-align:left;border-top:1px solid var(--divider);transition:background .15s}
.prow:first-child{border-top:0}
.prow:hover{background:var(--panel-soft)}
.prow .t{flex:1;min-width:0}
.prow .t b{display:block;font-size:15px;font-weight:700;color:var(--text-strong);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .t small{display:block;font-size:13px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .due{font-size:12px;font-weight:600;color:var(--text-muted);white-space:nowrap}
.prow .due.late{color:var(--err-text)}
.prow .arr{color:var(--text-subtle);transition:transform .15s,color .15s}
.prow:hover .arr{color:var(--brand);transform:translateX(2px)}
.stat{padding:20px}
.stat-h{display:flex;gap:12px;align-items:flex-start}
.ico-sq{width:40px;height:40px;border-radius:var(--r-control);display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);flex:none}
.stat-h h2{margin:0;font-size:18px;font-weight:800;color:var(--text-strong)}
.stat-h p{margin:2px 0 0;font-size:13px;color:var(--text-muted)}
.big{margin-top:20px;display:flex;align-items:baseline;gap:6px}
.big b{font-size:28px;font-weight:900;letter-spacing:-.02em;color:var(--text-strong)}
.big span{font-size:14px;color:var(--text-muted)}
.big em{margin-left:auto;font-style:normal;font-size:13px;font-weight:700;color:var(--brand)}
.bar{height:8px;border-radius:999px;background:var(--panel-soft);box-shadow:inset 0 0 0 1px var(--panel-border);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--brand);border-radius:999px;transition:width .4s}
.cap{font-size:12px;color:var(--text-muted);margin-top:6px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}
.tile{border:1px solid;border-radius:var(--r-control);padding:10px 12px;text-align:left;transition:filter .15s}
.tile:hover{filter:brightness(.97)}
.tile span{display:block;font-size:12px;font-weight:600}
.tile b{display:block;font-size:22px;font-weight:800;margin-top:2px}
.tile.pending{background:var(--panel-soft);border-color:var(--pend-border);color:var(--pend-text)}
.tile.progress{background:var(--prog-bg);border-color:var(--prog-border);color:var(--prog-text)}
.tile.error{background:var(--err-bg);border-color:var(--err-border);color:var(--err-text)}
.tile.completed{background:var(--ok-bg);border-color:var(--ok-border);color:var(--ok-text)}
.link{display:inline-flex;align-items:center;gap:6px;margin-top:18px;font-size:14px;font-weight:700;color:var(--brand)}
.link:hover{color:var(--brand-strong)}
.sec-title{margin:28px 0 12px;font-size:18px;font-weight:800;color:var(--text-strong)}
.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.tcard{display:flex;flex-direction:column;text-align:left;transition:border-color .15s,box-shadow .15s}
.tcard:hover{border-color:var(--brand-border);box-shadow:var(--shadow-panel),0 0 0 3px var(--focus-ring)}
.tcard .body{padding:18px 20px;flex:1}
.tcard h3{margin:14px 0 2px;font-size:18px;font-weight:800;letter-spacing:-.01em;color:var(--text-strong)}
.tcard p{margin:0;font-size:13px;color:var(--text-muted)}
.tcard .alert{display:flex;align-items:center;gap:6px;margin-top:12px;font-size:13px;font-weight:700;color:var(--err-text)}
.tcard .alert.ok{color:var(--text-muted);font-weight:500}
.tcard .foot{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;border-top:1px solid var(--divider);background:var(--panel-soft);font-size:13px;color:var(--text-muted)}
.tcard .foot b{color:var(--brand);font-weight:700;display:inline-flex;align-items:center;gap:4px}

/* Submenu de processos */
.nav-parent .cv{margin-left:auto;color:var(--text-subtle);transition:transform .15s}
.nav-parent[aria-expanded="false"] .cv{transform:rotate(-90deg)}
.subnav{margin:4px 0 4px 21px;padding-left:10px;border-left:1px solid var(--divider);display:flex;flex-direction:column;gap:2px}
.sub-i{display:flex;align-items:center;gap:10px;width:100%;min-height:38px;padding:0 10px;border-radius:var(--r-control);font-size:14px;font-weight:600;color:var(--nav-text);text-align:left;transition:background .15s}
.sub-i:hover{background:var(--nav-hover);color:var(--text-strong)}
.sub-i[aria-current="true"]{background:var(--nav-active);color:var(--brand-strong);box-shadow:inset 0 0 0 1px var(--brand-border)}
.sub-i .ct{margin-left:auto;min-width:22px;height:20px;padding:0 6px;border-radius:999px;display:inline-grid;place-items:center;font-size:11.5px;font-weight:700;background:var(--panel-soft);color:var(--text-muted);box-shadow:inset 0 0 0 1px var(--panel-border)}
.sub-i[aria-current="true"] .ct{background:var(--brand-soft);box-shadow:none;color:var(--brand-strong)}
.sub-i .ct.err{background:var(--err-bg);color:var(--err-text);box-shadow:inset 0 0 0 1px var(--err-border)}
/* Cabeçalho das páginas de lista */
.lhead{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.lhead .tt{flex:1;min-width:240px}
.lhead h1{margin:0;font-size:24px;line-height:28px;font-weight:800;letter-spacing:-.02em;color:var(--text-strong)}
.lhead p{margin:4px 0 0;font-size:14px;color:var(--text-muted)}
.scards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.scard{background:var(--panel);border:1px solid var(--panel-border);border-radius:var(--r-panel);box-shadow:var(--shadow-panel);padding:14px 16px}
.scard span{display:block;font-size:12px;font-weight:600;color:var(--text-muted)}
.scard b{display:block;font-size:26px;font-weight:800;letter-spacing:-.02em;color:var(--text-strong);margin-top:2px}
.scard small{display:block;font-size:12px;color:var(--text-subtle);margin-top:2px}
.scard.error{background:var(--err-bg);border-color:var(--err-border)} .scard.error span,.scard.error b,.scard.error small{color:var(--err-text)}
.scard.progress{background:var(--prog-bg);border-color:var(--prog-border)} .scard.progress span,.scard.progress b,.scard.progress small{color:var(--prog-text)}
.scard.completed{background:var(--ok-bg);border-color:var(--ok-border)} .scard.completed span,.scard.completed b,.scard.completed small{color:var(--ok-text)}
.dsplit{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.dsplit div{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--text-strong)}
.dsplit div em{margin-left:auto;font-style:normal;font-weight:800}
body[data-page="lista"] .top > .btn.primary{display:none}
body.no-open [data-cmd="new"]{display:none !important}
/* Lista */
.tabs-u{display:flex;gap:2px;border-bottom:1px solid var(--divider);margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
.tabs-u button{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;margin-bottom:-1px;border-bottom:2px solid transparent;font-size:14px;font-weight:700;color:var(--text-muted);white-space:nowrap;transition:color .15s}
.tabs-u button:hover{color:var(--text-strong)}
.tabs-u button[aria-current="true"]{color:var(--brand);border-bottom-color:var(--brand)}
.tabs-u .n{min-width:22px;height:20px;padding:0 6px;border-radius:999px;display:inline-grid;place-items:center;font-size:11.5px;background:var(--panel-soft);box-shadow:inset 0 0 0 1px var(--panel-border);color:var(--text-muted)}
.tabs-u button[aria-current="true"] .n{background:var(--brand-soft);box-shadow:none;color:var(--brand-strong)}
.tabs-u .n.err{background:var(--err-bg);box-shadow:inset 0 0 0 1px var(--err-border);color:var(--err-text)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--panel-border);background:var(--panel);font-size:13px;font-weight:600;color:var(--nav-text);white-space:nowrap;transition:background .15s,border-color .15s}
.chip:hover{background:var(--panel-soft)}
.chip svg{color:var(--text-subtle)}
.chip .n{font-size:12px;font-weight:700;color:var(--text-subtle)}
.chip[aria-pressed="true"]{background:var(--nav-active);border-color:var(--brand);color:var(--brand-strong)}
.chip[aria-pressed="true"] svg,.chip[aria-pressed="true"] .n{color:var(--brand)}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.filters .search{max-width:none;flex:1 1 260px}
.filters select{width:auto;min-width:180px;cursor:pointer}
.summary{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px;padding:8px 12px;border-radius:var(--r-control);border:1px solid var(--panel-border);background:var(--panel-soft);font-size:12px;color:var(--text-muted)}
.summary b{color:var(--text-strong)}
.group + .group{margin-top:16px}
.group-h{display:flex;align-items:center;gap:10px;width:100%;padding:12px 20px;background:var(--panel-soft);border-bottom:1px solid var(--divider);font-size:14px;font-weight:700;color:var(--text-strong);text-align:left}
.group-h .pill{margin-left:auto}
.group-h .cv{color:var(--text-subtle);transition:transform .15s}
.group.closed .group-h .cv{transform:rotate(-90deg)}
.group.closed .group-h{border-bottom:0}
.lrow{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(0,1.3fr) minmax(0,1fr) 72px 132px 18px;gap:16px;align-items:center;width:100%;padding:14px 20px;border-top:1px solid var(--divider);text-align:left;transition:background .15s}
.lrow:first-of-type{border-top:0}
.lrow:hover{background:var(--panel-soft)}

/* Gaveta do processo */
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:70;width:min(640px,100%);background:var(--app-bg);box-shadow:var(--shadow-floating);display:flex;flex-direction:column;animation:slidein .2s ease-out;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}

.d-head{background:var(--panel);border-bottom:1px solid var(--divider);padding:16px 24px;display:flex;flex-direction:column;gap:10px;flex:none}

.sbtn{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 12px;border-radius:var(--r-control);border:1px solid var(--pend-border);background:var(--pend-bg);color:var(--pend-text);font-size:13px;font-weight:700;white-space:nowrap;transition:filter .15s}

/* Página do processo */
.back{display:inline-flex;align-items:center;gap:6px;margin-bottom:14px;font-size:14px;font-weight:700;color:var(--text-muted)}

@media (max-width:720px){ .phead{padding:16px} .phead h1{font-size:21px} .stage-b{padding-left:20px} }
/* Conclusão mais clara */
.task{align-items:flex-start;transition:background .2s,border-color .2s}

.tk{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;border:2px solid var(--pend-border);background:var(--panel);margin:0;padding:0;color:#fff;align-self:center}

.tkbtn:focus{outline:none}.tkbtn:focus-visible{box-shadow:0 0 0 3px var(--focus-ring)}
.tk.ok{background:var(--ok-strong);border-color:var(--ok-strong)}

.sbtn{gap:6px}
.sbtn:not(.ok):not(.na):not(:disabled){border-color:var(--brand-border);color:var(--brand);background:var(--panel)}

.sbtn.ok{background:var(--ok-strong);border-color:var(--ok-strong);color:#fff}

.stage{transition:background .2s}

/* Início: o que é do usuário */

.stag.wt{background:var(--sch-bg);border-color:var(--sch-border);color:var(--sch-text)}

const isDone = st => !!(st && st.s);
function addMonths(iso, n){ const d = new Date(iso); const day = d.getDate(); d.setMonth(d.getMonth()+n); if(d.getDate()<day) d.setDate(0); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
const isWaiting = p => p.status==="andamento" && !!analyze(p).wait;
// Tarefas automáticas: registradas na abertura do processo, sempre concluídas
function normalize(p){
  const tp = TIPO[p.tipo]; if(!tp) return p;
  const autos = tp.etapas.flatMap(e=>e.tasks).filter(t=>t.auto && !(p.tarefas&&p.tarefas[t.id]&&p.tarefas[t.id].s));
  if(!autos.length) return p;
  const tarefas = {...(p.tarefas||{})}; autos.forEach(t => { tarefas[t.id] = {s:"feito", por:p.criadoPor, em:p.criadoEm, auto:true}; });
  return {...p, tarefas};
}
function analyze(p){
  const tipo = TIPO[p.tipo]; if(!tipo) return null;
  const tar = p.tarefas||{}; let cur=-1, done=0, total=0;
  const et = etapasOf(p).map((e,i) => { const n = e.tasks.filter(t=>isDone(tar[t.id])).length; total+=e.tasks.length; done+=n; const ok = n===e.tasks.length; if(!ok && cur<0) cur=i; return {...e,n,ok}; });
  // Etapa com carência: só vira pendência X meses após a conclusão da etapa anterior
  let wait = null;
  if(cur>0 && p.status==="andamento" && et[cur].espera){
    const prevEm = et[cur-1].tasks.map(t => tar[t.id] && tar[t.id].s ? tar[t.id].em : "").sort().pop();
    if(prevEm){ const libera = addMonths(prevEm, et[cur].espera); if(libera > todayStr()) wait = libera; }
  }
  const pend = cur>=0 && p.status==="andamento" && !wait ? [...new Set(et[cur].tasks.filter(t=>!isDone(tar[t.id])).map(t=>t.d))] : [];
  return {tipo, et, cur, pend, done, total, wait};
}
function computeStatus(p, tar){
  if(p.status==="cancelado") return "cancelado";
  const all = tasksOf(p);
  if(all.some(t => t.dec && tar[t.id] && tar[t.id].s==="sim")) return "revertido";
  return all.every(t => isDone(tar[t.id])) ? "concluido" : "andamento";
}
const isLate = p => p.status==="andamento" && !!p.prazo && p.prazo < todayStr() && !analyze(p).wait;
function stInfo(p, a){
  if(p.status==="concluido") return {k:"completed", l:"Concluído"};
  if(p.status==="revertido") return {k:"pending", l:"Revertido"};
  if(p.status==="cancelado") return {k:"pending", l:"Cancelado"};
  a = a || analyze(p);
  if(a.wait) return {k:"scheduled", l:"Agendado"};
  if(isLate(p)) return {k:"error", l:"Atrasado"};
  return {k:"progress", l:"Em andamento"};
}
const waitingMe = p => !!S.dept && p.status==="andamento" && analyze(p).pend.includes(S.dept);

let db=null, userCap=null; const queues={};
const enqueue = (id, fn) => (queues[id] = (queues[id]||Promise.resolve()).catch(()=>{}).then(fn));
const local = { data:{}, load(){ try{ this.data = JSON.parse(ls.get("jp_local")||"{}")||{}; }catch(e){ this.data={}; } }, save(){ ls.set("jp_local", JSON.stringify(this.data)); } };
const merge = (a,b) => { const o={...a}; for(const k in b){ const v=b[k]; o[k] = v && typeof v==="object" && !Array.isArray(v) && a[k] && typeof a[k]==="object" && !Array.isArray(a[k]) ? merge(a[k],v) : v; } return o; };
async function commit(id, patch, kind="update"){
  const before = S.procs.slice();
  const i = S.procs.findIndex(p=>p.id===id);
  if(kind==="delete"){ if(i>=0) S.procs.splice(i,1); } else if(kind==="set"){ if(i>=0) S.procs[i]=normalize({id,...patch}); else S.procs.push(normalize({id,...patch})); } else if(i>=0) S.procs[i] = merge(S.procs[i], patch);
  render();
  try{
    if(S.mode==="local"){ if(kind==="delete") delete local.data[id]; else if(kind==="set") local.data[id]=patch; else local.data[id]=merge(local.data[id]||{}, patch); local.save(); }
    else { const ref = db.collection("processos").doc(id); await enqueue(id, () => kind==="delete" ? ref.delete() : kind==="set" ? ref.set(patch) : ref.update(patch)); }
    return true;
  }catch(e){
    S.procs = before; render();
    const c = e && e.code;
    toast(c==="invalid_argument" ? "Sem permissão para alterar. Peça acesso de Colaborador ao Lucas." : c==="quota_exceeded" ? "Limite de armazenamento atingido." : "Não foi possível salvar. Tente de novo.");
    return false;
  }
}
const log = (p, acao) => { const h=(p.historico||[]).slice(-149); h.push({em:nowIso(), por:S.me.id, acao}); return h; };
function setTask(p, task, value, silent){
  const prev = (p.tarefas||{})[task.id]||null;
  const tar = {...(p.tarefas||{})}; tar[task.id] = {s:value||null, por:S.me.id, em:nowIso()};
  const status = computeStatus(p, tar);
  const verb = {feito:"concluiu", na:"marcou como não se aplica", sim:"respondeu sim", nao:"respondeu não"}[value] || "reabriu";
  const patch = {tarefas:{[task.id]:tar[task.id]}, status, atualizadoEm:nowIso(), historico:log(p, verb+": "+task.txt)};
  if(status!==p.status){ patch.concluidoEm = (status==="concluido"||status==="revertido") ? nowIso() : null; patch.historico.push({em:nowIso(), por:S.me.id, acao: status==="concluido"?"concluiu o processo":status==="revertido"?"encerrou o processo: cliente mantido":"reabriu o processo"}); }
  const a0 = analyze(p), a1 = analyze({...p, tarefas:tar, status});
  if(a1.cur!==a0.cur && a1.cur>=0) S.exp[p.id] = new Set([a1.cur]);
  commit(p.id, patch).then(ok => {
    if(!ok || silent) return;
    const undo = () => { const c = S.procs.find(x=>x.id===p.id); if(c) setTask(c, task, prev && prev.s, true); };
    if(status==="concluido" && p.status!=="concluido") toast("Processo concluído", undo);
    else if(value) toast(value==="feito" ? "Tarefa concluída" : value==="na" ? "Marcada como não se aplica" : "Resposta registrada", undo);
  });
}

// Tempo médio da abertura do processo até o resultado da Leggacy (CNPJ liberado, alteração registrada, baixa concluída)
const LEGGACY_KPI = [ ["abertura","Novo CNPJ","building","abertura até o CNPJ liberado"], ["alteracao","Alteração contratual","pen","abertura até o registro na Junta"], ["baixa","Baixa empresarial","box","abertura até a baixa concluída"] ];

function saveEdit(){
  readDraft(); const p = S.procs.find(x=>x.id===S.open), D = S.draft; if(!p||!D) return;

  const keys = ["empresa","cnpj","prazo","obs"]; if(PERDA_DIRETA.includes(p.tipo)) keys.push("honPerdido"); if(p.tipo==="inativa") keys.push("honAnterior"); if(hasInicio(p.tipo)) keys.push("inicioInat"); if(p.tipo==="reativacao") keys.push("reatJunta"); if(p.tipo==="saida") keys.push("contato","novoContador","contadorNome","contadorContato"); if(hasReuniao(p.tipo,"alinhamento")) keys.push("reunAlinh"); if(hasReuniao(p.tipo,"acompanhamento")) keys.push("reunAcomp"); if(p.tipo==="alteracao") keys.push("altItens","altDesc"); if(hasCusto(p.tipo)) keys.push("custo","pagador","parcelas"); if(hasCampo(p.tipo,"honorario")) keys.push("honorario","honCobranca","trab","trabQtd","trabValor"); if(hasCampo(p.tipo,"regime")) keys.push("regime","regimeObs");

  S.editing = false; S.draft = null;
  if(!Object.keys(patch).length){ renderDrawer(); return toast("Nenhuma alteração"); }

  commit(p.id, patch).then(ok => ok && toast("Alterações salvas"));
}

function saveValue(patch, label){
  const p = S.procs.find(x=>x.id===S.open); if(!p) return;
  const changed = Object.keys(patch).some(k => (p[k]??null) !== (patch[k]??null)); if(!changed) return;
  commit(p.id, {...patch, atualizadoEm:nowIso(), historico:log(p, label)}).then(ok => {
    if(!ok) return;
    const np = S.procs.find(x=>x.id===p.id); if(!np) return;
    const t = allTasks(np.tipo).find(t => t.campo && Object.keys(patch).some(k => CAMPO_KEYS[t.campo].includes(k)));
    const a = analyze(np), ei = np.status==="andamento" ? a.et.findIndex(e=>e.tasks.includes(t)) : -1;
    if(t && campoOk(np,t) && !isDone((np.tarefas||{})[t.id]) && ei>=0 && ei<=a.cur) setTask(np, t, "feito");
    else toast("Informação salva");
  });
}
function saveField(id, val){
  const p = S.procs.find(x=>x.id===S.open); if(!p) return; const key = id.slice(2);
  if(key==="empresa" && !val){ $("#f_empresa").value = p.empresa; return toast("Informe o nome da empresa"); }
  if((p[key]||"")===(val||"")) return;
  const names = {empresa:"o nome", cnpj:"o CNPJ", prazo:"o prazo", contato:"o contato", obs:"as observações"};
  commit(p.id, {[key]: val||null, atualizadoEm:nowIso(), historico:log(p, "alterou "+names[key])}).then(ok => ok && toast("Alteração salva"));
}

function reportData(){
  const ym = S.movMonth || todayStr().slice(0,7), d = movData(ym), prev = movData(ymShift(ym,-1));
  const saldo = Math.round((d.ganho-d.perda)*100)/100, saldoPrev = Math.round((prev.ganho-prev.perda)*100)/100;
  const hist = Array.from({length:6}, (_,i)=>ymShift(ym, i-5)).map(m => { const x = movData(m); return {m, g:x.ganho, l:x.perda}; });
  return { ym, d, saldo, saldoPrev, hist, ent: d.ent.slice().sort((a,b)=>(b.v||0)-(a.v||0)), sai: d.sai.slice().sort((a,b)=>(b.v||0)-(a.v||0)), tipos: tiposAgg(d.sai) };
}
function reportSummary(r){
  const mes = ymLabel(r.ym).toLowerCase(), ne = r.ent.length, ns = r.sai.length;
  const p1 = ne ? `Em ${mes}, a Jaralcon iniciou ${ne} ${ne===1?"novo contrato":"novos contratos"}, somando ${BRL(r.d.ganho)} em honorários mensais.` : `Em ${mes}, não houve início de novos contratos.`;
  const p2 = ns ? ` No mesmo período, ${ns} ${ns===1?"empresa reduziu ou encerrou":"empresas reduziram ou encerraram"} seus honorários, totalizando ${BRL(r.d.perda)} por mês.` : ` Não houve perda de honorários no período.`;
  const p3 = ` O saldo da receita recorrente foi de ${r.saldo>=0?"+":"−"} ${BRL(Math.abs(r.saldo))} por mês${r.saldoPrev!==0||r.saldo!==0?`, frente a ${r.saldoPrev>=0?"+":"−"} ${BRL(Math.abs(r.saldoPrev))} no mês anterior`:""}.`;
  return p1+p2+p3;
}
function openReport(){
  const r = reportData(), sg = v => (v>0?"+ ":v<0?"− ":"")+BRL(Math.abs(v));
  const maxH = Math.max(1, ...r.hist.map(h=>Math.max(h.g,h.l)));
  const rows = (arr, sign) => arr.map(x=>`<div class="rr"><div><b>${esc(x.p.empresa)}</b><small>${esc(TIPO[x.p.tipo].nome)} · aberto em ${fmtFull(x.p.criadoEm)}</small></div><span class="${x.v==null?'na':sign>0?'up':'down'}">${x.v==null?"Valor não informado":(sign>0?"+ ":"− ")+BRL(x.v)}</span></div>`).join("");
  $("#layer").innerHTML = `<div class="overlay" data-close></div><div class="modal report" role="dialog" aria-modal="true" aria-label="Relatório do mês">
    <div class="rhero"><button class="x rx" data-close aria-label="Fechar">${ic("x",20)}</button>
      <img src="${LOGO_JARALCON}" alt="Jaralcon Assessoria Contábil" class="rlogo">
      <div class="rkick">Relatório mensal · ${ymLabel(r.ym)}</div><h2>Movimentações Empresariais</h2>
      <svg class="rwave" viewBox="0 0 800 40" preserveAspectRatio="none" aria-hidden="true"><path d="M0 28 C 120 4, 220 4, 330 22 S 560 40, 660 16 S 760 6, 800 14" fill="none" stroke="#DEAC29" stroke-width="2.2"/></svg></div>
    <div class="rbody">
      <div class="rkpis"><div class="g"><span>Novos honorários</span><b>+ ${BRL(r.d.ganho)}</b><small>${r.ent.length} ${r.ent.length===1?"contrato":"contratos"} no mês</small></div><div class="l"><span>Honorários perdidos</span><b>− ${BRL(r.d.perda)}</b><small>${r.sai.length} ${r.sai.length===1?"empresa":"empresas"} no mês</small></div><div class="${r.saldo>=0?'g':'l'} s"><span>Saldo mensal</span><b>${sg(r.saldo)}</b><small>mês anterior: ${sg(r.saldoPrev)}</small></div></div>
      <p class="rsum">${esc(reportSummary(r))}</p>
      <div class="rsec"><h3>Evolução nos últimos 6 meses</h3><div class="rchart">${r.hist.map(h=>`<div class="rc ${h.m===r.ym?'cur':''}"><div class="rbars"><i class="g" style="height:${Math.round(h.g/maxH*100)}%" title="Novos ${BRL(h.g)}"></i><i class="l" style="height:${Math.round(h.l/maxH*100)}%" title="Perdidos ${BRL(h.l)}"></i></div><span>${MES[+h.m.slice(5,7)-1].replace('.','')}</span></div>`).join("")}</div><div class="rleg"><span><i class="g"></i>Novos honorários</span><span><i class="l"></i>Honorários perdidos</span></div></div>
      <div class="rsec"><h3>Novos contratos</h3>${r.ent.length?rows(r.ent,1):`<p class="rmuted">Nenhum contrato novo no mês.</p>`}</div>
      <div class="rsec"><h3>Honorários perdidos</h3>${r.sai.length?rows(r.sai,-1):`<p class="rmuted">Nenhuma perda no mês.</p>`}</div>

async function downloadPdf(btn){

function alertaTexto(p, tipo, extra){
  const a = analyze(p), etapa = a.cur>=0 ? `Etapa ${a.cur+1} de ${a.et.length} · ${a.et[a.cur].t}` : "";
  const link = LINK_SISTEMA ? `\nAbrir o processo: ${LINK_SISTEMA}#${p.id}` : "";
  if(tipo==="leggacy"){
    const assunto = `[Processos] Leggacy sem retorno há ${extra.dias} dias · ${p.empresa} (${a.tipo.nome})`;
    const corpo = `A Leggacy ainda não concluiu "${extra.tarefa}".\n\nEmpresa: ${p.empresa}\nProcesso: ${a.tipo.nome} · protocolo ${p.codigo||""}\n${etapa}\nEnviado à Leggacy em ${fmtFull(extra.envio)} (${extra.dias} dias sem retorno).\n\nO Financeiro deve questionar a Leggacy sobre o andamento.${link}`;
    return {assunto, corpo};
  }
  const assunto = `[Processos] Atrasado há ${extra.dias} dias · ${p.empresa} (${a.tipo.nome})`;
  const corpo = `O processo está com o prazo vencido há ${extra.dias} dias.\n\nEmpresa: ${p.empresa}\nProcesso: ${a.tipo.nome} · protocolo ${p.codigo||""}\n${etapa}\nPrazo: ${fmtFull(p.prazo)}\nAguardando: ${a.pend.map(d=>DEPTS[d]).join(" e ")||"—"}${link}`;
  return {assunto, corpo};
}
// Cada setor pode ter vários e-mails (lista). Aceita também o formato antigo, em texto separado por vírgula.
const emailList = v => (Array.isArray(v) ? v : String(v||"").split(/[;,\s]+/)).map(x=>String(x).trim()).filter(Boolean);
const emailsDe = destinos => destinos.flatMap(d => emailList(S.emails[d]));
const emailOk = e => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);
function emDraftInit(){ if(!S.emDraft) S.emDraft = Object.fromEntries(["com","fin","reg"].map(d => { const l = emailList(S.emails[d]); return [d, l.length ? l : [""]]; })); }
function emReadDraft(){ if(!S.emDraft) return; ["com","fin","reg"].forEach(d => { S.emDraft[d] = S.emDraft[d].map((_,i) => ($("#em_"+d+"_"+i)?.value ?? S.emDraft[d][i] ?? "")); }); }
// Procura situações novas e registra um aviso para cada uma (roda sempre que os dados mudam)
let alertTimer=null;
function checarAlertas(){ clearTimeout(alertTimer); alertTimer = setTimeout(checarAlertasAgora, 600); }
function checarAlertasAgora(){
  if(!S.loaded || !S.alertasOk || S.alertasBloq || (S.mode!=="local" && !db)) return;
  const existe = new Set(S.alertas.map(x=>x.id));
  const novos = [];
  active().filter(p => p.status==="andamento").forEach(p => {
    const a = analyze(p); if(!a || a.cur<0) return;
    tasksOf(p).filter(t => t.cobranca && !isDone((p.tarefas||{})[t.id])).forEach(t => {
      const id = p.id+"_leg_"+t.marcoId; const marco = allTasks(p.tipo).find(x=>x.id===t.marcoId);
      novos.push({id, p, tipo:"leggacy", extra:{dias:diasDesde(t.envio), envio:t.envio, tarefa: marco ? marco.txt : "o processo"}});
    });
    if(isLate(p) && daysLate(p) > ATRASO_AVISO_DIAS) novos.push({id:p.id+"_atr_"+a.cur, p, tipo:"atraso", extra:{dias:daysLate(p)}});
  });
  novos.filter(n => !existe.has(n.id) && !S.alertasCriando.has(n.id)).forEach(n => criarAlerta(n));
}
async function criarAlerta(n){
  S.alertasCriando.add(n.id);
  const destinos = ALERTA_TIPOS[n.tipo].destinos, txt = alertaTexto(n.p, n.tipo, n.extra);
  const doc = { tipo:n.tipo, procId:n.p.id, empresa:n.p.empresa, processo:TIPO[n.p.tipo].nome, destinos, assunto:txt.assunto, corpo:txt.corpo, criadoEm:nowIso(), status:"pendente", enviadoEm:null };
  let enviado = false; try{ enviado = await enviarEmail(doc, emailsDe(destinos)); }catch(e){}
  if(enviado){ doc.status="enviado"; doc.enviadoEm=nowIso(); }
  try{
    if(S.mode==="local"){ const L = alertasLocal(); L[n.id]=doc; ls.set("jp_alertas", JSON.stringify(L)); S.alertas = Object.entries(L).map(([id,v])=>({id,...v})); renderSide(); if(S.page==="avisos") renderMain(); }
    else await db.collection("alertas").doc(n.id).set(doc);
  }catch(e){ S.alertasCriando.delete(n.id); S.alertasBloq = true; }
}
const alertasLocal = () => { try{ return JSON.parse(ls.get("jp_alertas")||"{}")||{}; }catch(e){ return {}; } };
async function salvarAlerta(id, patch){
  if(S.mode==="local"){ const L=alertasLocal(); L[id]={...L[id],...patch}; ls.set("jp_alertas", JSON.stringify(L)); S.alertas=Object.entries(L).map(([k,v])=>({id:k,...v})); render(); return true; }
  try{ await db.collection("alertas").doc(id).update(patch); return true; }catch(e){ toast("Não foi possível salvar. Tente de novo."); return false; }
}
async function salvarEmails(){
  emReadDraft();
  const v = Object.fromEntries(["com","fin","reg"].map(d => [d, [...new Set(emailList(S.emDraft ? S.emDraft[d] : S.emails[d]))]]));
  const bad = Object.values(v).flat().filter(e => !emailOk(e));
  if(bad.length) return toast("E-mail inválido: "+bad[0]);
  S.emDraft = null; S.emDirty = false;
  S.emails = v;
  if(S.mode==="local"){ ls.set("jp_emails", JSON.stringify(v)); toast("E-mails salvos"); renderMain(); return; }
  try{ await db.collection("config").doc("emails").set(v); toast("E-mails salvos"); renderMain(); }catch(e){ toast("Não foi possível salvar. Tente de novo."); }
}
function pageAvisos(){
  emDraftInit();
  const lst = S.alertas.slice().sort((a,b)=>String(b.criadoEm).localeCompare(String(a.criadoEm)));
  const pend = lst.filter(x=>x.status!=="enviado").length;
  const nomeDest = d => d.map(x=>DEPTS[x]).join(", ");
  const row = x => `<div class="avr ${x.status==="enviado"?'ok':''}"><div class="avh"><span class="ttag ${x.tipo==='leggacy'?'tt-inatividade':'tt-exclusao'}">${ic(x.tipo==='leggacy'?'clock':'alert',13)}${esc(ALERTA_TIPOS[x.tipo]?.nome||x.tipo)}</span><span class="avs ${x.status==="enviado"?'ok':''}">${x.status==="enviado"?"Enviado "+(x.enviadoEm?fmtDT(x.enviadoEm):""):"Envio pendente"}</span><span class="avd">${fmtDT(x.criadoEm)}</span></div>
    <b>${esc(x.assunto)}</b><small>Para: ${esc(nomeDest(x.destinos||[]))}${emailsDe(x.destinos||[]).length?" · "+esc(emailsDe(x.destinos||[]).join(", ")):" · e-mails não cadastrados"}</small>
    <pre class="avc">${esc(x.corpo)}</pre>
    <div class="ava"><button class="btn sm" data-avcopy="${x.id}">${ic("copy",14)}Copiar e-mail</button>${x.procId&&S.procs.some(p=>p.id===x.procId)?`<button class="btn sm" data-open="${x.procId}">Abrir processo</button>`:""}${x.status!=="enviado"?`<button class="btn sm primary" data-avsent="${x.id}">Marcar como enviado</button>`:""}</div></div>`;
  return `<div class="lhead"><div class="tt"><h1>Avisos por e-mail</h1><p>Avisos gerados automaticamente quando a Leggacy passa de ${LEGGACY_DIAS} dias sem retorno ou quando um processo fica mais de ${ATRASO_AVISO_DIAS} dias atrasado.</p></div></div>
  <div class="avgrid">
    <section class="panel"><div class="panel-h"><div><h2>Quem recebe</h2><p class="ph-sub">Cada setor pode ter quantos e-mails precisar</p></div></div><div class="fields" style="grid-template-columns:minmax(0,1fr)">
      ${["com","fin","reg"].map(d => `<div class="field"><label class="emlab"><span class="dot ${d}"></span>${DEPTS[d]}<em>${emailList(S.emDraft[d]).length} ${emailList(S.emDraft[d]).length===1?"e-mail":"e-mails"}</em></label>
        <div class="emlist">${S.emDraft[d].map((v,i) => `<div class="emrow"><input class="input" id="em_${d}_${i}" type="email" value="${esc(v)}" placeholder="nome@jaralcon.com.br" aria-label="E-mail ${i+1} da ${DEPTS[d]}">${S.emDraft[d].length>1||v?`<button class="x emx" data-emdel="${d}" data-i="${i}" aria-label="Remover e-mail" title="Remover">${ic("x",16)}</button>`:""}</div>`).join("")}</div>
        <button class="mini emadd" data-emadd="${d}">${ic("plus",14)}Adicionar e-mail</button></div>`).join("")}
      <div><button class="btn primary" data-cmd="emails-salvar">Salvar e-mails</button></div></div>
      <div class="avrules"><b>Regras</b><span><i class="dot fin"></i>Leggacy sem retorno em ${LEGGACY_DIAS} dias → Diretoria e Financeiro</span><span><i class="dot reg"></i>Processo atrasado há mais de ${ATRASO_AVISO_DIAS} dias, em qualquer etapa → Diretoria, Financeiro e Regularidade</span><span class="muted">Cada situação gera um único aviso. Se o processo seguir atrasado em outra etapa, sai um novo aviso.</span></div></section>
    <section class="panel"><div class="panel-h"><h2>Avisos gerados</h2><span class="pill ${pend?'errp':''}">${pend} ${pend===1?"pendente":"pendentes"}</span></div>
      <div class="note" style="margin:14px 20px 0">O envio automático dos e-mails será ligado pelo TI. Até lá, use "Copiar e-mail" para enviar e marque como enviado.</div>
      ${lst.length?`<div class="avlist">${lst.map(row).join("")}</div>`:`<div class="empty small"><div class="ico-sq ok">${ic("check")}</div><h3>Nenhum aviso até agora</h3><p>Quando um processo atrasar ou a Leggacy não der retorno, o aviso aparece aqui.</p></div>`}</section>
  </div>`;
}

function setDept(d){ S.dept=d; ls.set("jp_dept", d); S.deptMenu=false; render(); }
document.addEventListener("click", e => {
  const t = e.target.closest("button,[data-close],[data-back]"); if(!t) return; const d = t.dataset;
  if(t.matches("[data-close]")) return ($("#layer").innerHTML="");
  if(t.matches("[data-back]")) return backFromProcess();
  if(d.cmd==="menu"){ document.body.classList.add("nav-open"); const s=document.createElement("div"); s.className="scrim"; s.id="scrimNav"; s.onclick=()=>{document.body.classList.remove("nav-open"); s.remove();}; document.body.appendChild(s); return; }
  if(d.cmd==="new") return canOpen() ? openNew(d.tipo||"") : toast("Só a Diretoria abre processos");
  if(d.cmd==="report") return openReport();
  if(d.cmd==="pdf") return downloadPdf(t);
  if(d.cmd==="toggleproc"){ S.procOpen=!S.procOpen; return renderSide(); }
  if(d.cmd==="deptmenu"){ S.deptMenu=!S.deptMenu; return renderSide(); }
  if(d.setdept) return setDept(d.setdept);
  if(d.go){ if(d.go==="mov" && !canMoney()) return; if(d.go==="avisos" && !canManage()) return; return go(d.go, {tipo:"", q:""}); }
  if(d.cmd==="emails-salvar") return salvarEmails();
  if(d.emadd){ emReadDraft(); S.emDraft[d.emadd].push(""); renderMain(); const i=S.emDraft[d.emadd].length-1; setTimeout(()=>$("#em_"+d.emadd+"_"+i)?.focus(),0); return; }
  if(d.emdel){ emReadDraft(); const L=S.emDraft[d.emdel]; L.splice(+d.i,1); if(!L.length) L.push(""); return renderMain(); }
  if(d.avsent){ return salvarAlerta(d.avsent, {status:"enviado", enviadoEm:nowIso()}).then(ok=>ok&&toast("Marcado como enviado")); }
  if(d.avcopy){ const x=S.alertas.find(y=>y.id===d.avcopy); if(!x) return; const txt=`Para: ${emailsDe(x.destinos||[]).join(", ")}\nAssunto: ${x.assunto}\n\n${x.corpo}`; try{ navigator.clipboard.writeText(txt).then(()=>toast("E-mail copiado"),()=>toast("Não foi possível copiar")); }catch(err){ toast("Não foi possível copiar"); } return; }
  if(d.mm){ S.movMonth = ymShift(S.movMonth || todayStr().slice(0,7), +d.mm); return renderMain(); }
  if(d.list) return go("lista", {status:d.list, tipo:"", deptFilter:d.dept||"", q:""});
  if(d.type) return go("lista", {tipo:d.type, status:"ativos", deptFilter:"", q:""});
  if(d.tab!==undefined){ S.status=d.tab; return render(); }
  if(d.chip!==undefined){ S.tipo=d.chip; return render(); }
  if(d.group){ S.closedGroups.has(d.group) ? S.closedGroups.delete(d.group) : S.closedGroups.add(d.group); return renderMain(); }
  if(d.open) return openDrawer(d.open);
  if(d.pick){ $("#newForm").dataset.tipo=d.pick; document.querySelectorAll("[data-pick]").forEach(b=>b.setAttribute("aria-checked", String(b===t))); $("#n_err").hidden=true; renderNewVals(); renderNewObs(); const pl=$("#n_prazo_lbl"); if(pl) pl.firstChild.textContent = (INICIO_LBL[d.pick]||"Prazo")+" "; return $("#n_empresa").focus(); }
  if(d.scope==="n" && d.k){ const f=$("#newForm"); if(d.k==="pagador") f.dataset.pagador=d.v; if(d.k==="regime") f.dataset.regime=d.v; if(d.k==="trab") f.dataset.trab = f.dataset.trab==="1" ? "" : "1";
    if(d.k==="reunAlinh"||d.k==="reunAcomp"||d.k==="reatJunta") f.dataset[d.k] = f.dataset[d.k]==="0" ? "1" : "0";
    if(d.k==="novoContador") f.dataset.novoContador = f.dataset.novoContador==="1" ? "" : "1";
    if(d.k==="motivo"){ f.dataset.motivo = d.v; $("#n_err").hidden = true; }
    if(d.k==="alt"){ f.dataset.altdesc = $("#n_altdesc")?.value || ""; const it = new Set((f.dataset.alt||"").split(",").filter(Boolean)); it.has(d.v) ? it.delete(d.v) : it.add(d.v); f.dataset.alt = [...it].join(","); $("#n_err").hidden=true; return renderNewObs(); } if(d.k==="forma") f.dataset.parcelas = d.v==="avista" ? "1" : String(Math.max(2, +(f.dataset.parcelas||0)||2)); renderNewVals(); return; }
  const p = S.open && S.procs.find(x=>x.id===S.open); if(!p) return;
  const task = id => tasksOf(p).find(x=>x.id===id) || allTasks(p.tipo).find(x=>x.id===id);
  if(d.stage!==undefined){ const s = S.exp[p.id]||(S.exp[p.id]=new Set()); const i=+d.stage; s.has(i)?s.delete(i):s.add(i); return renderDrawer(); }
  if(d.scope==="e" && d.k && S.draft){ readDraft(); const D=S.draft;
    if(d.k==="pagador") D.pagador=d.v; if(d.k==="regime") D.regime=d.v; if(d.k==="trab") D.trab=!D.trab; if(d.k==="reunAlinh"||d.k==="reunAcomp"||d.k==="reatJunta"||d.k==="novoContador") D[d.k]=!D[d.k]; if(d.k==="motivo") D.motivo=d.v;
    if(d.k==="alt"){ const it=new Set(D.altItens||[]); it.has(d.v)?it.delete(d.v):it.add(d.v); D.altItens=[...it]; } if(d.k==="forma") D.parcelas = d.v==="avista" ? 1 : Math.max(2, D.parcelas||2);
    return renderEditForm(p); }
  if(d.scope==="m" && d.k){
    if(S.dept!=="com") return toast("Somente a Diretoria define esses dados");
    if(d.k==="pagador") return saveValue({pagador:d.v}, "definiu que quem paga é "+(d.v==="jaralcon"?"a Jaralcon":"o cliente"));
    if(d.k==="regime") return saveValue({regime:d.v}, "definiu o regime tributário: "+REGIMES[d.v]);
    if(d.k==="trab"){ const cur = S.procs.find(x=>x.id===S.open); const on = !(cur&&cur.trab); return saveValue({trab:on}, on?"ativou o honorário trabalhista":"desativou o honorário trabalhista"); }
    if(d.k==="forma"){ const cur = S.procs.find(x=>x.id===S.open); const n = d.v==="avista" ? 1 : Math.max(2, (cur&&cur.parcelas)||2); return saveValue({parcelas:n}, n===1 ? "definiu pagamento à vista" : "definiu pagamento parcelado em "+n+"x"); }
  }
  { const tk = task(d.task||d.na||d.dec); if(tk && !canDo(tk)) return denyTask(tk); }
  if(d.task){ const tk=task(d.task); return setTask(p, tk, isDone((p.tarefas||{})[tk.id]) ? null : "feito"); }
  if(d.na) return setTask(p, task(d.na), "na");
  if(d.dec) return setTask(p, task(d.dec), ((p.tarefas||{})[d.dec]||{}).s===d.v ? null : d.v);
  if(["edit","cancel","reopen","delete","delete-yes"].includes(d.act) && !canManage()) return toast("Só a Diretoria pode alterar o processo");
  if(d.act==="edit") return startEdit(p);
  if(d.act==="edit-cancel"){ S.editing=false; S.draft=null; return renderDrawer(); }
  if(d.act==="cancel") return commit(p.id, {status:"cancelado", concluidoEm:nowIso(), atualizadoEm:nowIso(), historico:log(p,"cancelou o processo")}).then(ok => ok && toast("Processo cancelado", () => { const c=S.procs.find(x=>x.id===p.id); c && commit(c.id, {status:computeStatus({...c,status:"andamento"}, c.tarefas||{}), concluidoEm:null, atualizadoEm:nowIso(), historico:log(c,"reabriu o processo")}); }));
  if(d.act==="reopen"){ const st = computeStatus({...p,status:"andamento"}, p.tarefas||{}); return commit(p.id, {status:st, concluidoEm: st==="andamento"?null:nowIso(), atualizadoEm:nowIso(), historico:log(p,"reabriu o processo")}).then(ok => ok && toast("Processo reaberto")); }
  if(d.act==="delete"){ S.confirm="delete"; return renderDrawer(); }
  if(d.act==="nope"){ S.confirm=null; return renderDrawer(); }
  if(d.act==="delete-yes"){ const copy={...p}; delete copy.id; backFromProcess(); return commit(p.id, null, "delete").then(ok => ok && toast("Processo excluído", () => commit(p.id, copy, "set"))); }
});
document.addEventListener("change", e => {
  const id = e.target.id;
  if(id==="fDept"){ S.deptFilter=e.target.value; return render(); }
  if(/^f_(empresa|cnpj|prazo|contato|obs)$/.test(id)) saveField(id, e.target.value.trim());
  if(id==="e_custo"){ e.target.value = moneyIn(parseMoney(e.target.value)); if(id==="e_custo"){ readDraft(); const p=S.procs.find(x=>x.id===S.open); if(p) renderEditForm(p); } return; }
  if(id==="e_parcelas"){ readDraft(); const p=S.procs.find(x=>x.id===S.open); if(p) renderEditForm(p); return; }
  if(/^m_/.test(id) && S.dept!=="com"){ toast("Somente a Diretoria define esses dados"); return renderDrawer(); }
  if(id==="m_robs") return saveValue({regimeObs:e.target.value.trim()||null}, "atualizou as observações da estrutura tributária");
  if(id==="m_parcelas"){ const n = Math.min(48, Math.max(2, parseInt(e.target.value,10)||2)); return saveValue({parcelas:n}, "definiu pagamento parcelado em "+n+"x"); }
  if(id==="m_hant"){ const v = parseMoney(e.target.value); e.target.value = moneyIn(v); return saveValue({honAnterior:v}, "definiu o honorário atual antes da inatividade: "+(v==null?"vazio":BRL(v))); }
  if(id==="n_hant"||id==="n_hperd"){ e.target.value = moneyIn(parseMoney(e.target.value)); return renderNewVals(); }
  if(id==="e_hant"||id==="e_hperd"){ e.target.value = moneyIn(parseMoney(e.target.value)); readDraft(); const p=S.procs.find(x=>x.id===S.open); if(p) renderEditForm(p); return; }
  if(id==="m_tqtd"){ const n = e.target.value==="" ? null : Math.max(0, parseInt(e.target.value,10)||0); return saveValue({trabQtd:n}, "definiu "+(n||0)+" funcionários no honorário trabalhista"); }
  if(id==="m_tval"){ const v = parseMoney(e.target.value); e.target.value = moneyIn(v); return saveValue({trabValor:v}, "definiu o valor por funcionário: "+(v==null?"vazio":BRL(v))); }
  if(id==="n_tqtd"||id==="n_tval"){ if(id==="n_tval") e.target.value = moneyIn(parseMoney(e.target.value)); return renderNewVals(); }
  if(id==="e_tqtd"||id==="e_tval"||id==="e_honorario"){ if(id!=="e_tqtd") e.target.value = moneyIn(parseMoney(e.target.value)); readDraft(); const p=S.procs.find(x=>x.id===S.open); if(p) renderEditForm(p); return; }
  if(id==="n_honorario"){ e.target.value = moneyIn(parseMoney(e.target.value)); return renderNewVals(); }
  if(id==="m_hcob") return saveValue({honCobranca:e.target.value||null}, "definiu a cobrança do 1º honorário: "+(e.target.value?fmtFull(e.target.value):"vazio"));
  if(id==="n_parcelas"){ $("#newForm").dataset.parcelas = String(Math.min(48, Math.max(2, parseInt(e.target.value,10)||2))); return renderNewVals(); }
  if(id==="n_custo"){ e.target.value = moneyIn(parseMoney(e.target.value)); return renderNewVals(); }
  if(id==="m_custo"||id==="m_honorario"){ const v = parseMoney(e.target.value); e.target.value = moneyIn(v); const k = id.slice(2); saveValue({[k]:v}, k==="custo" ? "definiu o custo do processo: "+(v==null?"vazio":BRL(v)) : "definiu o novo honorário mensal: "+(v==null?"vazio":BRL(v))); }
  if(id==="n_honorario"){ e.target.value = moneyIn(parseMoney(e.target.value)); }
});
let qT;

document.addEventListener("submit", e => {
  e.preventDefault();
  if(e.target.id==="newForm") return submitNew();
  if(e.target.id==="editForm") return saveEdit();
  if(e.target.id==="noteForm"){
    const p = S.procs.find(x=>x.id===S.open), ta=$("#noteTxt"), txt=ta.value.trim(); if(!p||!txt) return;
    const notas = (p.notas||[]).slice(-199); notas.push({id:rid(6), por:S.me.id, em:nowIso(), txt}); ta.value="";
    commit(p.id, {notas, atualizadoEm:nowIso()}).then(ok => { if(!ok) ta.value=txt; });
  }
});
document.addEventListener("keydown", e => {
  if(e.key==="Escape"){ if(S.deptMenu){ S.deptMenu=false; return renderSide(); } if($("#layer").innerHTML){ return ($("#layer").innerHTML=""); }
    const tag=(e.target.tagName||"").toLowerCase(); if(S.page==="processo" && !S.editing && tag!=="input" && tag!=="textarea"){ return backFromProcess(); } if(document.body.classList.contains("nav-open")){ document.body.classList.remove("nav-open"); $("#scrimNav")?.remove(); } }
  if(e.key==="Enter" && (e.metaKey||e.ctrlKey) && e.target.id==="noteTxt"){ e.preventDefault(); $("#noteForm").requestSubmit(); }
  if(e.key==="Enter" && /^(f_(empresa|cnpj|contato)|m_custo|m_honorario|m_parcelas|m_tqtd|m_tval|m_hant)$/.test(e.target.id)){ e.preventDefault(); e.target.blur(); }
});

// ───────── Início ─────────
renderSide(); replaceNav();
function goLocal(msg){ S.mode="local"; S.me={id:"local", name:""}; S.banner=`<div class="banner">${msg}</div>`; local.load(); S.procs = Object.entries(local.data).map(([id,v])=>normalize({id,...v})); S.alertas = Object.entries(alertasLocal()).map(([id,v])=>({id,...v})); S.alertasOk = true; try{ S.emails = {...S.emails, ...(JSON.parse(ls.get("jp_emails")||"{}")||{})}; }catch(e){} S.loaded=true; render(); }
(async () => {
  if(!window.claude || typeof window.claude.use!=="function") return goLocal("Modo local: os dados ficam salvos só neste navegador. Abra pelo link do claude.ai para usar com a equipe.");
  const [d,u] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
  userCap = u; if(u){ try{ const m = await u.me(); S.me = {id:m.id, name:m.name, avatarUrl:m.avatarUrl}; }catch(e){} }
  if(!d) return goLocal("Modo local: os dados ficam salvos só neste navegador. Entre no claude.ai para usar com a equipe.");
  db = d;
  if(u){ try{ if(await u.can("data.write")===false) S.banner = `<div class="banner">Você tem acesso só de leitura. Peça acesso de Colaborador ao Lucas para marcar tarefas.</div>`; }catch(e){} }
  let first = true;
  db.collection("alertas").onSnapshot(snap => { S.alertas = snap.docs.map(x=>({id:x.id, ...x.data()})); S.alertasOk = true; S.alertasCriando.forEach(id => { if(S.alertas.some(a=>a.id===id)) S.alertasCriando.delete(id); }); renderSide(); if(S.page==="avisos") renderMain(); checarAlertas(); }, () => {});
  db.collection("config").onSnapshot(snap => { const e = snap.docs.find(x=>x.id==="emails"); if(e) S.emails = {com:[],fin:[],reg:[],...e.data()}; if(S.page==="avisos" && !(document.activeElement && /^em_/.test(document.activeElement.id))){ if(!S.emDirty) S.emDraft = null; renderMain(); } }, () => {});
  const sub = () => db.collection("processos").onSnapshot(snap => {
    S.procs = snap.docs.map(x=>normalize({id:x.id, ...x.data()})); S.loaded=true; render();
    if(first){ first=false; const h=location.hash.slice(1); if(h && S.procs.some(p=>p.id===h)) openDrawer(h); }
  }, err => { if(err && err.code==="unavailable") setTimeout(sub, 1500); else { S.loaded=true; S.banner=`<div class="banner">A lista não pôde ser carregada. Recarregue a página.</div>`; render(); } });
  sub();
})();
})();
</script>
</body>
</html>
